<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
        }
        .score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .controls {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="score">Счёт: <span id="score">0</span></div>
        <canvas id="game" width="400" height="400"></canvas>
        <div class="controls">Используйте стрелки на клавиатуре для управления</div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // Размер клетки и игрового поля
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = true;

        // Функция для генерации случайной позиции еды
        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        // Функция отрисовки игровых объектов
        function drawGame() {
            // Очищаем холст
            clearCanvas();
            
            // Двигаем змейку
            moveSnake();
            
            // Проверяем столкновения
            if (gameRunning) {
                checkCollision();
                drawFood();
                drawSnake();
            } else {
                // Если игра окончена, выводим сообщение
                ctx.fillStyle = 'white';
                ctx.font = '40px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('Игра окончена!', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px "Courier New"';
                ctx.fillText('Нажмите F5, чтобы перезапустить', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        // Функция очистки холста
        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Функция отрисовки змейки
        function drawSnake() {
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Голова змейки
                    ctx.fillStyle = '#58a6ff';
                } else {
                    // Тело змейки
                    ctx.fillStyle = '#3fb950';
                }
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        // Функция отрисовки еды
        function drawFood() {
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // Функция движения змейки
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // Если змейка съела еду
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;
                randomFood();
            } else {
                // Иначе убираем хвост
                snake.pop();
            }
        }

        // Функция проверки столкновений
        function checkCollision() {
            const head = snake[0];

            // Столкновение со стенами
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameRunning = false;
            }

            // Столкновение с самой собой
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameRunning = false;
                }
            }
        }

        // Обработчик нажатий клавиш
        document.addEventListener('keydown', (e) => {
            // Предотвращаем движение в противоположную сторону
            if (e.key === 'ArrowUp' && dy !== 1) {
                dx = 0;
                dy = -1;
            } else if (e.key === 'ArrowDown' && dy !== -1) {
                dx = 0;
                dy = 1;
            } else if (e.key === 'ArrowLeft' && dx !== 1) {
                dx = -1;
                dy = 0;
            } else if (e.key === 'ArrowRight' && dx !== -1) {
                dx = 1;
                dy = 0;
            }
        });

        // Инициализация игры
        randomFood();
        setInterval(drawGame, 100); // Запускаем игровой цикл каждые 100 мс

    </script>

</body>
</html>
