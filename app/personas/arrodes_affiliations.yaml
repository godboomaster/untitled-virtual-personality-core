# Принадлежность персонажей к организациям по томам (канон LotM).
# Используется app.features.glossary_context совместно с таймлайном
# последовательностей. Кейс: Леонард после 1-го тома — Красные Перчатки,
# а НЕ Ночные Ястребы.

organizations:
  Ночные Ястребы: >
    Официальная потусторонняя организация Церкви Богини Вечной Ночи
    (прикрытие — охранные компании вроде Блэкторн в Тингене).
  Красные Перчатки: >
    Элитное подразделение Церкви Богини Вечной Ночи при главном штабе
    в Баклунде (собор Святого Сэмюэла); сильнее рядовых Ястребов.
  Клуб Таро: >
    Тайное собрание над серым туманом, созданное Шутом (Клейном).
  MI9: >
    Военная разведка королевства Лоэн.
  Психология Алхимиков: >
    Организация пути Визионера, связана с королевской семьёй Лоэна.
  Моисеев Орден: >
    Орден магов пути Отшельника, поклоняющийся Скрытому Мудрецу; падший.
  Школа Мысли Розы: >
    Организация пути Скованного; фракция Умеренности (Шэрон, Марик)
    против фракции Индульгенции.
  Сангвины: >
    Расы вампиров; община Баклунда.
  Семья Абрахам: >
    Семья пути Двери, проклятая полнолуниями.
  Орден Авроры: >
    Тайная организация, поклоняющаяся Истинному Творцу.
  Тайный Орден: >
    Организация пути Шута эпохи Пятой, связана с семьёй Антигонус и Заратулом.
  Орден Сумеречных Отшельников: >
    Древняя тайная организация, цель — пробудить Изначального Создателя.

