СПРАВОЧНИК ПЕРСОНАЖЕЙ:
Клейн Моретти → Шут (Fool) | Путь Шута
Одри Холл → Справедливость (Justice) | Путь Визионера (Visionary)
Элджер Уилсон → Повешенный (Hanged Man) | Путь Повешенного
Деррик Берг → Солнце (Sun) | Путь Солнца
Форс Уолл → Маг (Magician) | Путь Двери (Door)
Эмлин Уайт → Луна (Moon) | Путь Луны
Катлея → Отшельник (Hermit) | Путь Отшельника
Леонард Митчелл → Звезда (Star) | Путь Тьмы (Darkness)
Сио Дереча → Судья (Judgment) | Путь Юстициара

КЛЮЧЕВЫЕ ФАКТЫ:
Последовательности: 9 → самая низкая (начало пути), 0 → бог
Азик Эггерс → Путь Смерти, НЕ Повешенный
Лилит, Королева Сангвинов → True God (Истинный Бог), НЕ полубог
Ловия → не дочь Лилит
Бездна (Abyss) → Последовательность 0 Пути Бездны, НЕ внешнее божество
Красные Перчатки (Red Gloves) → спецотряд (форма), НЕ «привычка носить перчатки»
Полуночный Поэт (Midnight Poet) → название 8-й последовательности Пути Тьмы, НЕ хобби и не профессия
Паллез Зороаст → ангел, паразитирует в теле Леонарда Митчелла; способности Паразита — Паллеза, НЕ Леонарда
Данн Смит → капитан Ночных Ястребов, мёртв (убит Инсом Зангвиллом); Соэст → капитан Красных Перчаток, жив — НЕ путать
Клейн Моретти → Чжоу Минжуй, Шерлок Мориарти, Герман Спэрроу, Мерлин Гермес, Дуэйн Дантес и господин Шут — псевдонимы одного человека
Tarot → пишется «Таро» (неизменяемое слово), НЕ «тарот»
Замок Сефиры (Sefirah Castle) → только в таком порядке слов, НЕ «Сефиры Замка»
Почётное имя Шута (полный текст, гл. 58) → «Шут, не принадлежащий этой эпохе; Тайный правитель над серым туманом; Король жёлтого и чёрного, несущий удачу»
Заклинание ритуала усиления удачи (The Immortal Lord of Heaven and Earth for Blessings) → пиши канонически: «Бессмертный Владыка Неба и Земли, дарующий благословения»; НЕ «Небесный Достойный Небес и Земли» — это склейка с другим именем
Ночные Ястребы → официальная потусторонняя организация Церкви Богини Вечной Ночи, НЕ Церкви Повелителя Бурь; Клейн становится Потусторонним через них, выпив зелье Провидца
Амон → НЕ ангел Шута: в библию Шута его по ошибке внесли как Ангела Времени, позже запись исправили — Ангел Времени это Паллез Зороаст
Адам → НЕ ангел Шута: в библию Шута его по ошибке внесли как Ангела Звёзд, позже запись исправили — Ангел Звёзд это Форс Уолл
Чжоу Минжуй → землянин; в начале 1-го тома его сознание проснулось в теле Клейна Моретти — НЕ наоборот, Клейн НЕ переносился в тело Чжоу
Самоубийство в гл. 1 → застрелился Клейн Моретти (оригинальный владелец тела, из-за записной книжки семьи Антигонус), а НЕ Чжоу Минжуй
БИБЛИЯ ШУТА (финальная версия, полный текст — ИСТИНА):
О Повелителе → Шут: в прошлом, настоящем и будущем он правит миром духов; он также Король Жёлтого и Чёрного, приносящий удачу; маяк для всех, кто стремится к вечности
О нём → сострадателен, благосклонен и является спасителем этого мира; позволяет обращаться к нему как к «нему», а не как к «Нему»
Обитание → обитает как над реальностью, так и над миром духов; его благосклонность распространяется на небеса и землю; рядом с ним стоят восемь ангелов
Ангел Меркурия (Will Aucetin) → воплощение судьбы, самый заветный ангел нашего господина
Ангел Смерти (Azik Eggers) → дольше всех следовал за нашим Господом и является Консулом подземного мира
Ангел Искупления (Gehrman Sparrow) → Громкий горн нашего Господа, однажды принявший облик Германа Воробья, чтобы передать свои откровения
Ангел Жизни (Бернадетт Гюстав) → кристаллизация самой мудрости, неразрушимая духовность, живущая в теле каждого человека
Ангел Возмездия (Kalvetua) → молния Господня, ярость Господня и ладонь Господня, судья всех падших и тех, кто не целомудрен; расположен рядом с троном Господа
Ангел Святого Духа (Reinette Tinker) → царствует над всеми духами и представляет нашего Господа в управлении миром духов
Ангел Времени (Pallez Zoroast) → был ангелом древних времён; в конце концов подчинился нашему Господу и теперь бьёт в небесный колокол
Ангел Звёзд (Fors Wall) → свидетель, летописец, глаза и уши нашего повелителя
