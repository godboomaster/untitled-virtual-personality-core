# Запуск:
#   cp .env.example .env              # и заполнить ключи/токены
#   docker compose up -d --build      # API (127.0.0.1:8000) + веб (127.0.0.1:5173)
#   docker compose --profile telegram up -d --build   # ещё и Telegram-боты
#
# Что живёт где:
#   .env                — файл хоста, смонтирован в контейнер: ключи, сохранённые
#                         из веба, пишутся в него же;
#   свои персоны и память — том vpc_data (data/personas и память; отдельно от
#                         data/ локального запуска), встроенные персоны — в образе;
#   модели Hugging Face — том hf_cache.
# Браузера в контейнере нет: режим управления, веб-чаты LLM и поиск через
# браузер работают только при локальном запуске.

x-backend: &backend
  build: .
  image: virtual-persona-core
  restart: unless-stopped
  environment:
    # Слушать интерфейс контейнера; наружу — только проброс на 127.0.0.1 хоста
    API_HOST: 0.0.0.0
    API_PORT: ${API_PORT:-8000}
    # Имя хоста проверяется (защита от DNS rebinding): localhost, 127.0.0.1, ::1
    # и этот список
    API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-localhost}
    # Ollama на хосте; OLLAMA_URL из .env (localhost) в контейнере не годится
    OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    # Абсолютный путь хоста из .env в контейнере не существует
    VPC_DATA_DIR: /app/data
    DATA_DIR: /app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - type: bind
      source: ./.env
      target: /app/.env
      bind:
        create_host_path: false   # нет .env — ошибка, а не пустая папка .env
    - vpc_data:/app/data
    - hf_cache:/root/.cache/huggingface

services:
  api:
    <<: *backend
    container_name: virtual-persona-api
    command: ["python", "-m", "app.main", "api"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ['API_PORT'], timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://127.0.0.1:${API_PORT:-8000}
    image: virtual-persona-web
    container_name: virtual-persona-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"

  # Все персоны, для которых в .env задан <ПЕРСОНА>_BOT_TOKEN, в одном процессе
  bots:
    <<: *backend
    container_name: virtual-persona-bots
    profiles: ["telegram"]
    command: ["python", "-m", "app.main", "all"]

volumes:
  vpc_data:
  hf_cache:
