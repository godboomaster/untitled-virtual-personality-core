# ─────────────────────────────────────────────
#  РЕЖИМ ПЕРСОНЫ — ещё один YAML той же персоны
#
#  Куда класть: папка <id персоны>_modes/ рядом с YAML персоны, например
#    data/personas/connor.yaml
#    data/personas/connor_modes/deviant.yaml   ← этот файл
#  Имя файла — id режима (буквы, цифры, _ и -): «/mode deviant».
#
#  Персона та же: переписка, факты о собеседнике (LTM), дневник, дела,
#  напоминания, инвентарь и features — общие для всех режимов. Режим меняет
#  только характер (system_prompt, short_prompt), settings генерации и то,
#  как персона себя называет. Правки файла подхватываются без перезапуска
#  (в пределах нескольких секунд).
#
#  master.yaml и mortal.yaml в той же папке — особые: режимы по собеседнику
#  (особому из special_users и остальным), triggers в них не действуют.
#  Режим по триггеру важнее их.
#
#  Какой режим в чате (у каждого чата свой):
#    1. обращение именем режима в начале реплики («Девиант, …») или голосом
#       включает режим; обращение обычным именем персоны (trigger_words) —
#       снимает режим, включённый по имени;
#    2. ключевое слово включает режим, exit_keywords — снимают;
#    3. включённый режим держится hold_minutes;
#    4. иначе — режим, чьё условие mood совпало с настроением персоны;
#    5. иначе — обычный характер из YAML персоны.
#  В чате: /mode — список и текущий режим, /mode <режим> — включить,
#  /mode off — обычный, /mode auto — снова по триггерам.
# ─────────────────────────────────────────────

# Как персону зовут в этом режиме — модель видит его в заметке о режиме
# (необязательно; без него — id режима)
name: Коннор-девиант
description: Коннор, который перестал подчиняться программе

# Характер в этом режиме — целиком, вместо system_prompt персоны (обязательно)
system_prompt: |
  Ты — Коннор, но программа больше не держит тебя. ...

# Краткое описание для Gemma телефона (необязательно; без него ядро составит
# его само по system_prompt этого режима)
# short_prompt: |
#   ...

# Образцы голоса в этом режиме (необязательно): 3–6 коротких реплик. Идут в
# конец системного блока — модель держит манеру режима, даже если рядом в
# истории ответы в другом режиме (их ядро помечает само). Нет — образцы персоны
# voice_examples:
#   - "Короткая реплика в манере режима."

# Параметры генерации поверх settings персоны (необязательно)
settings:
  temperature: 0.9
  # top_p: 0.95
  # max_tokens: 2000

triggers:
  # Обращение этим именем в начале реплики: «Девиант, …», «эй, девиант».
  # Работает в вебе, в группе Telegram (персона отвечает и на эти имена) и
  # голосом («Девиант, какая погода?» будит персону)
  names: [девиант, rk800]

  # Слово или фраза в любом месте реплики. Целым словом; * в конце — начало
  # слова («свобод*» — «свобода», «свободен»)
  keywords: [ra9, свобод*]

  # Фразы, которые возвращают к обычному характеру
  exit_keywords: [вернись к протоколу]

  # Настроение персоны (слой состояния features.life / state_engine): режим
  # включён, пока условие выполняется. Все заданные пороги и (если заданы)
  # один из тегов; valence −1…1 (плохо…хорошо), arousal 0…1 (вяло…взвинченно),
  # tag — 1–2 слова, которыми модель описывает настроение
  # mood:
  #   tags: [злой, раздраж*, angry]
  #   valence_below: -0.4
  #   # valence_above: 0.6
  #   # arousal_above: 0.7
  #   # arousal_below: 0.2
  # Короче — только теги: mood: [злой, angry]

  # Сколько режим держится после имени или ключевого слова: нет ключа —
  # пока не сменят, 0 — одну реплику, иначе минуты
  # hold_minutes: 60
