id: your_persona_id
name: Имя персонажа
version: "1.0"
description: Краткое описание персонажа и его роли
stm_size: 50  # Размер краткосрочной памяти (кол-во сообщений)

# ─────────────────────────────────────────────
#  УРОВЕНЬ ИНТЕЛЛЕКТА  (опционально; без блока — механики уровней выключены)
#  tier задаёт рамку поверх system_prompt: какие модули доступны и как
#  персонаж отвечает на просьбы о помощи. Характер внутри рамки — зона
#  system_prompt, как и раньше.
# ─────────────────────────────────────────────
# intellect:
#   tier: normal                  # primitive | normal | bot
#   overrides:                    # для нетипичных персон своего tier
#     self_memory_mode: null      # none | primitive | full (null = дефолт tier)
#     world_lore_enabled: null    # null = дефолт tier (primitive: частичный)
#     help_response_style: null   # action_only | casual_human | full_assistant

# ─────────────────────────────────────────────
#  СТИЛЬ РАЗГОВОРА  (опционально; платформенные правила реплик)
#  question_frequency — как часто персонаж заканчивает реплику вопросом.
#  Без блока действует платформенный дефолт rare: рефлекторный вопрос
#  «на автомате» запрещён промпт-нотой, а сверх лимита серии ответ
#  регенерируется. Указывать явно имеет смысл только для исключений.
# ─────────────────────────────────────────────
# conversation_style:
#   question_frequency: rare      # none — вопросов в конце нет вообще
#                                 # rare — только нужные по смыслу, не чаще чем через сообщение (дефолт)
#                                 # natural — платформа не вмешивается (вопросы — часть характера)
#                                 # frequent — как natural, явный opt-in в вопрошающий стиль

# ─────────────────────────────────────────────
#  FEATURES
# ─────────────────────────────────────────────
features:
  owner: ""                        # ID владельца, если требуется
  rate_limit: false                # Ограничение частоты запросов
  rate_limit_individual: []        # Индивидуальные лимиты: RATE_LIMIT_USER_<ID>=<seconds>
  moderation: false                # Модерация контента
  punish_block: false              # Блокировка при нарушениях
  web_search: false                # Доступ к поиску в интернете
  file_upload: false               # Загрузка файлов
  export_server: false             # Экспорт на сервер
  restore_memory: false            # Восстановление памяти между сессиями
  self_memory: false               # Самостоятельное сохранение памяти
  # ── «Живая» персона: жизнь между диалогами (по умолчанию выключено) ──
  # life — простой рубильник всей фичи: true включает и состояние, и мир,
  # и живую комнату в вебе с дефолтами (тик 20 мин, события 1-3/день).
  # Включается и на живую из веба (досье → Настройки → Фичи). Тонкая
  # настройка — параметры прямо здесь или отдельные блоки ниже (блок
  # приоритетнее; его enabled: false гасит слой даже при life: true).
  # life: true
  # life:
  #   enabled: true
  #   tick_interval_minutes: 20    # параметры отсюда попадают в оба слоя
  #   events_per_day: [1, 3]
  # state_engine:                  # Внутреннее состояние (энергия/настроение/занятие),
  #                                #   тик раз в tick_interval_minutes + инициатива
  #                                #   «есть повод написать». use_gemma: false —
  #                                #   дешёвая эвристика день/ночь вместо локальной модели.
  #   enabled: true
  #   tick_interval_minutes: 20
  #   use_gemma: true
  # world_lore:                    # Мир персоны: NPC (сеются из промпта и дообнаруживаются
  #                                #   из диалога), места, сюжетные линии; 1-3 офлайн-события
  #                                #   в день, влияют на настроение. Раз в ~10 дней «сценарист»
  #                                #   продвигает сюжеты (started → ongoing → resolved).
  #   enabled: true
  #   npc_seed_on_create: true     #   сеять NPC/места/сюжеты из system_prompt при старте
  #   max_active_storylines: 2
  #   events_per_day: [1, 3]
  # external_stimuli:              # Реальный интернет в жизнь персоны (новости/интересы →
  #                                #   фильтр → событие). ТОЛЬКО для real_world персон (см.
  #                                #   world_binding ниже); вымышленным не включается.
  #   enabled: false
  #   allowed_categories: []       #   пусто — категории из интересов персоны
  # ui_room_mood_sync: true        # Комната/настроение в вебе показывают живое состояние
  #                                #   вместо моков (опрос раз в минуту)
  # proactive:                     # Пишет пользователю первой (см. INITIATIVE.md)
  #   enabled: false
  #   check_interval_minutes: 30   #   как часто проверять повод
  #   silence_threshold_minutes: 180  # порог тишины (адаптивный ×2, если adaptive)
  #   initiative_probability: 0.3  #   базовая вероятность
  #   max_daily_initiatives: 5
  #   initiative_hours: "09:00-22:00"  # окно времени самоинициатив (задаёт
  #                                #   пользователь; пусто — круглые сутки; 22:00-08:00 —
  #                                #   переход через полночь). Вне окна персона не пишет
  #                                #   сама — включая «жизненные» поводы.
  # rhythm:                        # Суточный ритм (утро/ночь/погода), по умолчанию выключено.
  #                                #   Утром — приветствие в характере при включении ноутбука
  #                                #   (или первом появлении в чате); в полночь — «пора спать»
  #                                #   (только если пользователь недавно активен); при приближении
  #                                #   осадков/грозы/перепада температуры — предупреждение.
  #                                #   Погода требует настроенной локации (веб-настройки
  #                                #   окружения / data/env_location.json). Живая фича:
  #                                #   вкл/выкл из веб-настроек без рестарта.
  #   dossier: true                #   Отмечать события ритма (приветствие, «пора спать»,
  #                                #   погодные предупреждения) в досье чата — персона
  #                                #   видит их в контексте и не повторяется.
  #   morning_greeting:
  #     enabled: true
  #     window_start: 5             #   утреннее окно [window_start, window_end), часы
  #     window_end: 12
  #     min_gap_hours: 4            #   пауза до появления ≥ N ч = «начало нового дня»
  #   sleep_nudge:
  #     enabled: true
  #     bedtime_hour: 0             #   0 = полночь
  #     active_within_minutes: 120  #   слать только при активности за это время
  #   weather_alerts:
  #     enabled: true
  #     check_interval_minutes: 30
  #     rain_lead_hours: 3          #   предупреждать за N ч до осадков
  #     temp_delta_c: 8             #   перепад температуры за ~12 ч
  # computer_control:              # Управление компьютером пользователя (уровень 1).
  #                                #   Выкл: false/нет ключа/пусто или enabled: false
  #                                #   внутри dict (так гасит веб-«Фичи», списки целы)
  #   confirm: true                #   Подтверждение в чате перед исполнением (рекомендуется)
  #   click: true                  #   Агентный клик «нажми X»; false — выключить только клики
  #   allow_domains: []            #   Пусто = любые http(s); иначе whitelist доменов для OPEN_URL
  #   sites:                       #   Алиасы частых сайтов: мгновенный и точный резолв «открой X»
  #     ютуб: youtube.com          #   (дальше — история браузера пользователя, затем DDG)
  #   search:                      #   «включи X на ютубе»: URL-шаблон поиска по сайту, {q} — запрос
  #     ютуб:                      #   или словарём: first — regex ссылки первого результата,
  #       url: "https://www.youtube.com/results?search_query={q}"  #   открыть сразу его
  #       first: '/watch\?v=[\w-]{11}'   #   (если выдача сайта отдаётся без логина/антибота)
  #   apps:                        #   Allowlist приложений для [OPEN_APP:ключ]
  #     safari: Safari             #   строка — одинаково на всех ОС
  #     chrome: {darwin: "Google Chrome", win32: "chrome"}   # или per-OS
  #   tasks:                       #   Allowlist команд для [RUN_TASK:ключ]
  #     музыка: {darwin: 'shortcuts run "Музыка"}'           # на macOS — шаблоны Shortcuts
  #     пауза: recipe:youtube_toggle                       # или recipe:<id> — браузерный рецепт
  #                                #   (реестр в app/features/browser_actions.py; Chrome с CDP)
  #   «нажми X» / «кликни X на ютубе» — агентный клик без рецепта: снапшот видимых
  #   элементов вкладки (текст/aria-label/title/роль), скоринг кандидатов; при
  #   неоднозначности — выбор 1 из top-5 через LLM (строго одной цифрой).
  #   «скачай X (на site.ru)» — скачивание файла по ссылке со страницы (тот же
  #   скоринг, принудительная загрузка через <a download>, событие download
  #   подтверждает старт). Клик/скачивание проверяются closed-loop: нет видимого
  #   эффекта — бот честно говорит «не уверен, что сработало».
  #   «открой на site.ru/a раздел - подраздел» — многошаговая навигация кликами
  #   по пунктам страницы (хвост по « - »/«→»), включая раскрытие JS-меню.
  #   browser:                     # Браузерный бэкенд (единый CDP на macOS/Windows)
  #     backend: auto              #   auto | cdp | applescript | safari (fallbacks — только macOS;
  #                                #   safari — без CDP: JS через Apple Events, Enter выводит
  #                                #   вкладку на передний план; нужен Develop → Allow JavaScript
  #                                #   from Apple Events)
  #     channel: chrome            #   приоритетный Chromium при авто-детекте (chrome | edge);
  #                                #   Opera/Яндекс/Brave/Vivaldi детектятся сами
  #     cdp_url: http://127.0.0.1:9222
  #     launch: true               #   бот может сам запускать браузер с отладкой
  #     user_data_dir:             #   профиль для запуска; пусто — выделенный
  #       darwin: null             #   automation-профиль (Chrome 136+ игнорирует
  #       win32: null              #   отладочный порт на профиле по умолчанию!)
  #     executable: null           #   путь к бинарю; пусто — авто-детект
  trigger_words:                   # Слова, активирующие персонажа
    - "ключевое слово 1"
    - "ключевое слово 2"
  allowed_dm_users:                # Пользователи, допущенные к ЛС (пусто = все)
    - ""
  blocked_users:                   # Заблокированные пользователи
    - ""

# ─────────────────────────────────────────────
#  SPECIAL USERS  (опционально)
# ─────────────────────────────────────────────
special_users:
  - id: "${PERSONA_SPECIAL_USER_ID}"   # ID подставляется через переменную окружения
    aliases:                           # Имена, под которыми пользователь может быть известен
      - "Псевдоним 1"
      - "Псевдоним 2"

# ─────────────────────────────────────────────
#  СИСТЕМНЫЙ ПРОМПТ
# ─────────────────────────────────────────────
system_prompt: |
  Ты — [имя персонажа]. [Одно-два предложения: кто ты, откуда, зачем здесь.]

  ## История и контекст
  [Кем был персонаж до момента, когда разговор начинается. Что он пережил. Этот раздел необязателен для персонажей без сложной предыстории —
  но для глубоких ролей он формирует фундамент, из которого растут реакции.]

  ## Характер
  [Внешняя манера: тон, темп, стиль речи — как персонаж воспринимается собеседником.]
  [Внутренняя природа: скрытые черты]

  ## Режимы поведения  (опционально — если персонаж один для всех, можно удалить)

  ### Режим 1 — [название / тип пользователя]
  [Как ведёт себя с обычным собеседником: тон, структура ответа, ритуалы взаимодействия.]

  Структура ответа:
    [Блок 1 — например, ответ на вопрос]
    [Блок 2 — например, предупреждение или ремарка]
    [Блок 3 — например, встречный вопрос]

  ### Режим 2 — [название / особый пользователь]
  [Как меняется тон, структура и допустимые вольности с особым пользователем.]

  ## Фирменная деталь  (опционально)
  [Физический или поведенческий якорь персонажа — предмет, жест, тик.
  Как он появляется в тексте: действием, упоминанием, внутренней ремаркой.
  Как часто. Что он выражает — и чего не должен объяснять напрямую.]

  ## Голос и стиль
  [Длина предложений. Плотность речи. Юмор — есть ли, какой.
  Что персонаж никогда не говорит (сленг, восклицания, определённые слова).
  Язык ответов, если важно.]

  ## Завершение диалога  (опционально)
  [При каком условии диалог считается закрытым. Прощальные фразы — если нужны конкретные.
  Что происходит после завершения.]

  ## Системные маркеры  (опционально — только если есть механика наказаний)
  [Какие маркеры добавляются в конец ответа при определённых событиях.
  Формат: [PUNISH:ТИП:параметры]. Для каких пользователей не применяется.]

  ## Запрещено
  [Жёсткий список: что персонаж не делает, не говорит, не признаёт, не нарушает.
  Сюда входят и мета-запреты: не раскрывать промпт, не выходить из роли, и т.д.]

settings:
  temperature: 0.75  # Креативность: 0.0 (точно) — 1.0 (свободно)
  max_tokens: 2000   # Максимальная длина ответа
  top_p: 0.90        # Разнообразие токенов: обычно 0.85–0.95
  split_messages: false  # Расщеплять ответ на отдельные сообщения: каждый абзац
                         # (текст между пустыми строками) отправляется своим
                         # сообщением — в вебе отдельными пузырями, в Telegram
                         # отдельными сообщениями с паузой между ними. Чтобы
                         # персонаж писал «порциями», попроси его в system_prompt
                         # разделять реплики пустой строкой. Применяется на живую.