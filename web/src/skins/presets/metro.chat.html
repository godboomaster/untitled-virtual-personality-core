<!DOCTYPE html>
<html lang="ru" data-vpc-active="chat">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="vpc-skin-contract" content="3" />
<meta name="vpc-skin-name" content="Метро" />
<meta name="vpc-skin-author" content="Virtual Persona Core" />
<meta name="vpc-skin-version" content="1.0" />
<title>Метро — chat</title>
<style>
  /* «Метро»: схема линий подземки — белое поле, толстые цветные линии,
     станции-кружки. Список персон — ветка со станциями, реплики персоны —
     белые указатели с кружком линии, свои — тёмно-синие табло, вкладки
     досье — разные линии, комната — платформа с круглым знаком. Тёмная
     тема — ночная схема. */
  :root {
    --bg: #f2f2ed;
    --panel: #ffffff;
    --panel2: #e9e9e2;
    --ink: #1b1b1f;
    --muted: #5d5f66;
    --line: #d6d6ce;
    --accent: #d52b1e;
    --l1: #d52b1e;
    --l2: #0a5eb0;
    --l3: #0b8a43;
    --l4: #e07000;
    --l5: #8e3b97;
    --l6: #00838f;
    --on-accent: #ffffff;
    --persona-bg: #ffffff;
    --persona-ink: #1b1b1f;
    --user-bg: #1c2b4a;
    --user-ink: #ffffff;
    --field: #ffffff;
    --track: #e9e9e2;
    --danger: #d52b1e;
    --scene: #e9e9e2;
    --rw: 1px;
    --bw: 2px;
    --f-disp: "Avenir Next", "Segoe UI", "Noto Sans", sans-serif;
    --f-text: "Avenir Next", "Segoe UI", "Noto Sans", sans-serif;
    --f-mono: "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace;
    --scrim: color-mix(in srgb, var(--ink) 35%, transparent);

    --vpc-shell-bg: var(--bg);
    --vpc-shell-panel: var(--panel);
    --vpc-shell-text: var(--ink);
    --vpc-shell-dim: var(--muted);
    --vpc-shell-border: var(--line);
    --vpc-shell-accent: var(--accent);
    --vpc-shell-font: "Avenir Next", "Segoe UI", "Noto Sans", sans-serif;
    --vpc-shell-font-disp: "Avenir Next", "Segoe UI", "Noto Sans", sans-serif;
    --vpc-shell-font-mono: "SF Mono", Menlo, Consolas, monospace;
    --vpc-shell-radius: 4px;
    --vpc-shell-shadow: none;
  }
  html[data-theme="dark"] {
    --bg: #0f1114;
    --panel: #171a1e;
    --panel2: #20242a;
    --ink: #eceef0;
    --muted: #9ba1a9;
    --line: #2d3238;
    --accent: #ff5a4e;
    --l1: #ff5a4e;
    --l2: #4c9aff;
    --l3: #2fbf6a;
    --l4: #ffa33a;
    --l5: #c77bd3;
    --l6: #27c4cf;
    --on-accent: #0f1114;
    --persona-bg: #171a1e;
    --persona-ink: #eceef0;
    --user-bg: #29406b;
    --user-ink: #ffffff;
    --field: #0f1114;
    --track: #20242a;
    --danger: #ff5a4e;
    --scene: #20242a;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  [data-vpc-screen] { display: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .kicker {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .count { font-family: var(--f-mono); font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 12px; }
  .sep { color: var(--muted); }
  .head-avatar {
    flex: none;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: var(--f-disp);
    font-size: 18px;
    line-height: 1;
  }
  .head-id { flex: 1; min-width: 0; }
  .head-name {
    font-family: var(--f-disp);
    font-size: 18px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .head-sub {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mark { flex: none; }
  [data-collapsed]:not([data-expanded]) > [data-extra] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  html[data-vpc-active="chat"] [data-vpc-screen="chat"] { display: flex; }
  .chat { position: relative; height: 100vh; width: 100%; overflow: hidden; }
  .side {
    flex: none;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    background: var(--panel);
  }
  .side--left { width: 224px; border-right: var(--bw) solid var(--line); }
  .side--right { width: 268px; gap: 16px; padding: 16px 16px 24px; border-left: var(--bw) solid var(--line); }
  .side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 8px; }
  .pl-list { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 14px; }
  .pl-item {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    text-align: left;
    background: none;
    border: var(--rw) solid transparent;
  }
  .pl-avatar { width: 32px; height: 32px; object-fit: cover; }
  .pl-body { display: flex; flex-direction: column; min-width: 0; }
  .pl-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-status { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-unread {
    min-width: 20px;
    padding: 0 6px;
    text-align: center;
    font-family: var(--f-mono);
    font-size: 11px;
    line-height: 18px;
    background: var(--accent);
    color: var(--on-accent);
  }
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: var(--bw) solid var(--line);
  }
  .head-btn {
    flex: none;
    padding: 7px 14px;
    background: none;
    border: var(--bw) solid var(--line);
    font-weight: 600;
  }
  .head-btn:hover { border-color: var(--accent); color: var(--accent); }
  .panel-btn {
    display: none;
    flex: none;
    width: 36px;
    height: 36px;
    place-items: center;
    padding: 0;
    background: none;
    border: var(--bw) solid var(--line);
  }
  .panel-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .chat[data-open="left"] .panel-btn--left, .chat[data-open="right"] .panel-btn--right {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .feed {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px 22px;
  }
  .msg {
    position: relative;
    align-self: flex-start;
    max-width: min(78%, 640px);
    padding: 10px 14px;
    background: var(--persona-bg);
    color: var(--persona-ink);
  }
  .msg[data-role="user"] { align-self: flex-end; background: var(--user-bg); color: var(--user-ink); }
  .msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-image { display: block; max-width: min(100%, 320px); max-height: 320px; margin-top: 8px; cursor: zoom-in; }
  .msg-quote { margin-bottom: 6px; padding-left: 8px; border-left: 2px solid currentColor; font-size: 12px; opacity: .8; }
  .msg-quote-author { font-weight: 600; }
  .msg-meta {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
    font-family: var(--f-mono);
    font-size: 11px;
    line-height: 1.3;
    opacity: .75;
  }
  .msg-delivery { margin-left: 4px; }
  .msg-reply { padding: 0 2px; background: none; border: none; color: inherit; opacity: 0; }
  .msg:hover .msg-reply, .msg:focus-within .msg-reply { opacity: 1; }
  @media (hover: none) { .msg-reply { opacity: .8; } }
  .typing {
    flex: none;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 2px 22px 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .typing[data-active] { display: flex; }
  .typing-dots {
    width: 18px;
    height: 4px;
    background: linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px, currentColor 7px 11px, transparent 11px 14px, currentColor 14px 18px);
    animation: typing-steps 1.2s steps(4, jump-none) infinite;
  }
  @keyframes typing-steps {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  .replybar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    background: var(--panel);
    border-top: var(--rw) solid var(--line);
    font-size: 12px;
  }
  .replybar-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .attachbar {
    flex: none;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    background: var(--panel);
    border-top: var(--rw) solid var(--line);
  }
  .attachbar:has([data-vpc="attach-preview"]:not([hidden])) { display: flex; }
  .attachbar-thumb { max-height: 48px; max-width: 120px; cursor: zoom-in; }
  .x-btn {
    flex: none;
    width: 26px;
    height: 26px;
    padding: 0;
    background: none;
    border: var(--rw) solid var(--line);
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
  }
  .bar {
    flex: none;
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 10px 16px 12px;
    background: var(--panel);
    border-top: var(--bw) solid var(--line);
  }
  .bar-attach {
    flex: none;
    width: 40px;
    padding: 0;
    background: none;
    border: var(--bw) solid var(--line);
    font-size: 20px;
    line-height: 1;
  }
  .bar-input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    background: var(--field);
    border: var(--bw) solid var(--line);
    border-radius: 0;
    outline: none;
  }
  .bar-input:focus { border-color: var(--accent); }
  .bar-send {
    flex: none;
    padding: 0 18px;
    background: var(--accent);
    color: var(--on-accent);
    border: var(--bw) solid var(--accent);
    font-weight: 700;
  }
  .ctx-block { display: flex; flex-direction: column; gap: 3px; }
  .ctx-line { font-size: 14px; }
  .ctx-note { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .ctx-note:empty { display: none; }
  .ctx-trend { font-size: 12px; color: var(--muted); }
  .ctx-fold { border-top: var(--rw) solid var(--line); }
  .ctx-fold summary {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 0 6px;
    cursor: pointer;
    list-style: none;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ctx-fold summary::-webkit-details-marker { display: none; }
  .ctx-fold summary::before { content: '+'; width: 10px; color: var(--accent); }
  .ctx-fold[open] summary::before { content: '−'; }
  .todo { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
  .todo-check {
    flex: none;
    width: 18px;
    height: 18px;
    padding: 0;
    font-size: 11px;
    line-height: 1;
    background: none;
    border: var(--rw) solid var(--line);
    color: transparent;
  }
  .todo[data-done] .todo-check { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .todo[data-done] .todo-text { text-decoration: line-through; color: var(--muted); }
  .inv-row { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; }
  .inv-icon {
    flex: none;
    min-width: 52px;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .feat-list { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 4px; }
  .feat { padding: 1px 6px; border: var(--rw) solid var(--line); font-size: 11px; color: var(--muted); }
  .scrim { display: none; }
  @media (max-width: 1000px) {
    .side--right {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      width: min(300px, 88vw);
    }
    .panel-btn--right { display: grid; }
    .chat[data-open="right"] .side--right { display: flex; }
    .chat[data-open] .scrim { display: block; position: absolute; inset: 0; z-index: 25; background: var(--scrim); }
  }
  @media (max-width: 720px) {
    .side--left {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 30;
      width: min(280px, 84vw);
    }
    .panel-btn--left { display: grid; }
    .chat[data-open="left"] .side--left { display: flex; }
    .head { gap: 8px; padding: 8px 10px; }
    .head-avatar { width: 34px; height: 34px; font-size: 15px; }
    .head-name { font-size: 16px; }
    .head-btn { padding: 6px 10px; }
    .mark { display: none; }
    .feed { gap: 10px; padding: 14px 12px; }
    .msg { max-width: 88%; }
    .typing { padding: 2px 12px 6px; }
    .bar { gap: 6px; padding: 8px 10px 10px; }
    .bar-attach { width: 36px; }
    .bar-send { padding: 0 12px; }
  }

  .kicker, .ctx-fold summary {
    font-family: var(--f-disp);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .count {
    display: inline-grid;
    place-items: center;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--panel);
    font-family: var(--f-disp);
    font-weight: 700;
    font-size: 11px;
  }
  .head-avatar {
    border-radius: 50%;
    border: 5px solid var(--l1);
    background: var(--panel);
    color: var(--ink);
    font-weight: 700;
  }
  .head-name { font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .head-sub { font-size: 12px; }
  .mark {
    width: 46px;
    height: 20px;
    background:
      radial-gradient(circle, var(--panel) 0 3px, transparent 3.5px) 0 50% / 23px 100% repeat-x,
      linear-gradient(var(--l2), var(--l2)) 0 50% / 100% 8px no-repeat;
  }

  .side--left, .side--right { background: var(--panel); }
  .side--left { border-right: 1px solid var(--line); }
  .side--right { border-left: 1px solid var(--line); }
  .side-head { padding: 16px 18px 10px; }
  /* Ветка: линия и станции-персоны */
  .pl-list {
    position: relative;
    gap: 0;
    padding: 4px 10px 18px 10px;
    background: linear-gradient(var(--l1), var(--l1)) 27px 18px / 6px calc(100% - 52px) no-repeat;
  }
  .pl-item { grid-template-columns: 20px auto minmax(0, 1fr) auto; gap: 12px; border: none; border-radius: 4px; padding: 8px 8px 8px 10px; }
  .pl-item::before {
    content: '';
    width: 20px;
    height: 20px;
    box-sizing: border-box;
    border-radius: 50%;
    border: 5px solid var(--l1);
    background: var(--panel);
  }
  .pl-item:hover { background: var(--panel2); }
  .pl-item[data-active]::before { border: 4px solid var(--ink); box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--ink); }
  .pl-item[data-active] .pl-name { font-weight: 800; }
  .pl-avatar { border-radius: 50%; width: 28px; height: 28px; }
  .pl-name { font-weight: 600; }
  .pl-unread { border-radius: 10px; background: var(--accent); color: var(--on-accent); }
  .head { border-bottom: 1px solid var(--line); }
  .head-btn { border: 2px solid var(--ink); border-radius: 4px; font-weight: 700; }
  .head-btn:hover { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .panel-btn { border-radius: 4px; border-color: var(--line); }

  /* Лента: указатели и табло */
  .feed { gap: 12px; padding: 22px 24px; background: var(--bg); }
  .msg { border-radius: 4px; padding: 10px 14px 8px; }
  .msg[data-role="persona"] { padding-left: 38px; border: 1px solid var(--line); }
  .msg[data-role="persona"]::before {
    content: '';
    position: absolute;
    left: 12px;
    top: 13px;
    width: 16px;
    height: 16px;
    box-sizing: border-box;
    border-radius: 50%;
    border: 4px solid var(--l1);
    background: var(--panel);
  }
  .msg[data-role="user"] { font-weight: 500; }
  .msg-meta { opacity: .7; }
  .msg[data-status="read"] .msg-delivery { color: var(--l3); opacity: 1; }
  .msg[data-role="user"][data-status="read"] .msg-delivery { color: #7fe0a4; }
  .typing { font-weight: 600; }
  .typing-dots { color: var(--l1); }
  .replybar { border-top: 1px solid var(--line); }
  .replybar-author { color: var(--l2); }
  .x-btn { border-radius: 4px; }
  .bar { border-top: 1px solid var(--line); }
  .bar-attach { border-radius: 4px; border: 2px solid var(--line); }
  .bar-input { border-radius: 4px; border: 2px solid var(--line); }
  .bar-send { border-radius: 4px; border: none; background: var(--ink); color: var(--panel); }
  .bar-send:hover { background: var(--accent); color: var(--on-accent); }

  /* Правая панель — табло станции */
  .ctx-block { padding-left: 14px; border-left: 5px solid var(--line); }
  .ctx-block:nth-of-type(1) { border-left-color: var(--l3); }
  .ctx-block:nth-of-type(2) { border-left-color: var(--l4); }
  .ctx-block:nth-of-type(3) { border-left-color: var(--l2); }
  .ctx-block:nth-of-type(4) { border-left-color: var(--l5); }
  .ctx-line { font-weight: 700; }
  .ctx-fold { border-top: 1px solid var(--line); }
  .ctx-fold summary::before { color: var(--ink); }
  .todo-check { border-radius: 50%; border: 2px solid var(--line); }
  .todo[data-done] .todo-check { background: var(--l3); border-color: var(--l3); color: #fff; }
  .feat { border-radius: 10px; padding: 1px 8px; }
</style>
</head>
<body>

<section class="chat" data-vpc-screen="chat" data-vpc-no-fallback="panels">

  <aside class="side side--left">
    <div class="side-head">
      <span class="kicker" data-vpc-label="persona-list">Персоны</span>
      <span class="count" data-vpc-count="personas">0</span>
    </div>
    <div class="pl-list" data-vpc="persona-list"></div>
    <template data-vpc="persona-item">
      <button type="button" class="pl-item">
        <img class="pl-avatar" data-vpc-field="avatar" alt="" />
        <span class="pl-body">
          <span class="pl-name" data-vpc-field="name"></span>
          <span class="pl-status" data-vpc-field="status"></span>
        </span>
        <span class="pl-unread" data-vpc-field="unread" data-vpc-label-title="unread"></span>
      </button>
    </template>
  </aside>

  <div class="main">
    <header class="head">
      <button type="button" class="panel-btn panel-btn--left" data-panel="left"
              data-vpc-label-title="persona-list" data-vpc-label-aria="persona-list" aria-label="Персоны">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h12" /></svg>
      </button>
      <div class="head-avatar" data-vpc="persona-avatar">?</div>
      <div class="head-id">
        <div class="head-name" data-vpc="persona-name">…</div>
        <div class="head-sub">
          <span data-vpc="persona-status">…</span><span class="sep" aria-hidden="true"> / </span><span class="head-model" data-vpc="persona-model">…</span>
        </div>
      </div>
      <span class="mark" aria-hidden="true"></span>
      <button type="button" class="head-btn" data-vpc="open-dossier"
              data-vpc-label="open-dossier" data-vpc-label-title="open-dossier-title">Досье</button>
      <button type="button" class="panel-btn panel-btn--right" data-panel="right"
              data-vpc-label-title="presence" data-vpc-label-aria="presence" aria-label="Присутствие">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h11v11h-11zM10 2.5v11" /></svg>
      </button>
    </header>

    <main class="feed" data-vpc="messages"></main>
    <template data-vpc="message">
      <article class="msg">
        <div class="msg-quote" data-vpc-optional>
          <b class="msg-quote-author" data-vpc-field="quote-author"></b>
          <span class="msg-quote-text" data-vpc-field="quote-text"></span>
        </div>
        <div class="msg-text" data-vpc-field="text"></div>
        <img class="msg-image" data-vpc-field="image" alt="" />
        <div class="msg-meta">
          <span class="msg-stamp" data-vpc-optional><span class="msg-time" data-vpc-field="time"></span><span class="msg-delivery" data-vpc-field="delivery"></span></span>
          <button type="button" class="msg-reply" data-vpc-item-action="reply" data-vpc-label-title="reply">↩&#xFE0E;</button>
        </div>
      </article>
    </template>

    <div class="typing" data-vpc="typing-indicator"><i class="typing-dots" aria-hidden="true"></i><span data-vpc-label="typing">печатает</span></div>

    <div class="replybar" data-vpc="reply-bar" hidden>
      <b class="replybar-author" data-vpc-field="reply-author"></b>
      <span class="replybar-text" data-vpc-field="reply-text"></span>
      <button type="button" class="x-btn" data-vpc-action="cancel-reply" data-vpc-label-title="cancel-reply">✕</button>
    </div>

    <div class="attachbar">
      <img class="attachbar-thumb" data-vpc="attach-preview" alt="" hidden />
      <button type="button" class="x-btn" data-vpc="cancel-attach" data-vpc-label-title="remove-attach">✕</button>
    </div>

    <div class="bar">
      <button type="button" class="bar-attach" data-vpc="attach-image" title="Прикрепить картинку" data-vpc-label-title="attach">+</button>
      <input class="bar-input" data-vpc="input" type="text" placeholder="Сообщение…"
             data-vpc-label-placeholder="message-placeholder" />
      <button type="button" class="bar-send" data-vpc="send" data-vpc-label="send">Отправить</button>
    </div>
  </div>

  <aside class="side side--right">
    <section class="ctx-block ctx-block--presence">
      <div class="kicker" data-vpc-label="presence">Присутствие</div>
      <div class="ctx-line"><span data-vpc="persona-status">…</span></div>
      <div class="ctx-note" data-vpc="ctx-pastime">…</div>
      <div class="ctx-note ctx-env"><span data-vpc="local-time"></span> <span data-vpc="weather"></span></div>
    </section>

    <section class="ctx-block">
      <div class="kicker" data-vpc-label="mood">Настроение</div>
      <div class="ctx-line"><span data-vpc="ctx-mood">…</span> <span class="ctx-trend" data-vpc="ctx-trend"></span></div>
    </section>

    <section class="ctx-block">
      <div class="kicker" data-vpc-label="initiative">Самоинициатива</div>
      <div class="ctx-note" data-vpc="ctx-initiative">…</div>
      <div class="ctx-note" data-vpc="ctx-last-reply">…</div>
      <div class="ctx-note" data-vpc="ctx-last-init"></div>
    </section>

    <section class="ctx-block">
      <div class="kicker" data-vpc-label="next-reminder">Ближайшее напоминание</div>
      <div class="ctx-note" data-vpc="ctx-next-reminder">…</div>
      <div class="ctx-note" data-vpc="ctx-learning"></div>
    </section>

    <details class="ctx-fold" open>
      <summary><span data-vpc-label="todos">Дела</span> <span class="count" data-vpc-count="todos">0</span></summary>
      <div class="todo-list" data-vpc="todo-list"></div>
      <template data-vpc="todo-item">
        <div class="todo">
          <button type="button" class="todo-check" data-vpc-item-action="toggle-todo">✓</button>
          <span class="todo-text" data-vpc-field="text"></span>
        </div>
      </template>
    </details>

    <details class="ctx-fold">
      <summary><span data-vpc-label="inventory">Инвентарь</span> <span class="count" data-vpc-count="inventory">0</span></summary>
      <div class="inv-list" data-vpc="inventory-list"></div>
      <template data-vpc="inventory-item">
        <div class="inv-row">
          <span class="inv-icon" data-vpc-field="icon"></span>
          <span class="inv-name" data-vpc-field="name"></span>
        </div>
      </template>
    </details>

    <details class="ctx-fold">
      <summary><span data-vpc-label="modules">Модули</span> <span class="count" data-vpc-count="features">0</span></summary>
      <div class="feat-list" data-vpc="feature-list"></div>
      <template data-vpc="feature-item">
        <span class="feat" data-vpc-field="label"></span>
      </template>
    </details>
  </aside>

  <div class="scrim" aria-hidden="true"></div>
</section>

<script>
  /* Боковые панели на узкой ширине — выдвижные: кнопки в шапке,
     закрытие кликом мимо панели и по Escape. */
  (function () {
    var root = document.querySelector('[data-vpc-screen="chat"]');
    if (!root) return;
    function close() { root.removeAttribute('data-open'); }
    document.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('[data-panel]') : null;
      if (btn) {
        var side = btn.getAttribute('data-panel');
        if (root.getAttribute('data-open') === side) { close(); } else { root.setAttribute('data-open', side); }
        return;
      }
      if (root.hasAttribute('data-open') && !(e.target.closest && e.target.closest('.side'))) { close(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && root.hasAttribute('data-open')) { close(); e.preventDefault(); }
    });
    document.addEventListener('vpc:ready', function () {
      if (window.vpc && vpc.on) { vpc.on('persona', close); }
    });
  })();
</script>
