<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════════
     VPC SKIN FILE · КОНТРАКТ v3 · ЭКРАН ЧАТА — ПРОЧТИ ЭТОТ БЛОК ПОЛНОСТЬЮ.

     Это самодостаточный файл ОДНОГО экрана скина (визуальной оболочки)
     ИИ-персоны: экран чата с левым сайдбаром (список персон), лентой
     сообщений и правым сайдбаром (контекст персоны). Скин персоны состоит
     из ТРЁХ ОТДЕЛЬНЫХ файлов — чат, досье, комната; этот файл отвечает
     ТОЛЬКО за чат. Не добавляй сюда разметку других экранов.
     Файл рендерится в изолированной песочнице (sandboxed iframe).

     ЖЁСТКИЕ ПРАВИЛА (нарушение = скин не пройдёт проверку при загрузке):

     1. Атрибуты data-vpc="..." и data-vpc-field="..." — НЕ удалять и
        НЕ переименовывать. По ним приложение находит, куда подставлять
        живые данные. Элементы с этими атрибутами МОЖНО перемещать,
        оборачивать в любые контейнеры и стилизовать как угодно —
        лишь бы атрибуты остались.

     2. Блок между маркерами VPC-BRIDGE:START / VPC-BRIDGE:END внизу
        файла — служебный, его ПЕРЕЗАПИШЕТ приложение. Не редактировать.

     3. Никаких внешних ресурсов: запрещены http/https-ссылки, CDN,
        <link>, <script src=...>, картинки и шрифты по URL. Сеть
        заблокирована политикой CSP. Картинки и шрифты — только inline
        (data-URI) или рисуй чистым CSS/SVG.

     4. Мета vpc-skin-contract в <head> (сейчас content="3") — версия
        контракта, на который рассчитан файл. Не повышай её сам: скин
        с версией новее приложения не загрузится. Нет меты — контракт v1.
        Имя/автор/версия скина — мета vpc-skin-name / -author / -version.

     5. ВСЁ ОСТАЛЬНОЕ — свободная зона: любая структура страницы,
        любые дополнительные элементы, декор, фоны, анимации, свой JS.
        Скин может выглядеть КАК УГОДНО непохоже на этот шаблон.

     СЛОВАРЬ ТОЧЕК ЭКРАНА ЧАТА.

     Обязательные (REQUIRED — проверяются при загрузке):
         [data-vpc-screen="chat"]   корневой блок экрана
         [data-vpc="messages"]      контейнер ленты сообщений
         <template data-vpc="message">  образец ОДНОГО сообщения; внутри
                                    обязателен [data-vpc-field="text"].
                                    Корень шаблона получает data-role="user"
                                    или data-role="persona" — стилизуй роли
                                    через [data-role="user"] { ... }
         [data-vpc="input"]         поле ввода текста (<input>/<textarea>)
         [data-vpc="send"]          кнопка отправки

     Необязательные (OPTIONAL — если есть, приложение заполнит;
     если удалишь — ничего не сломается):

       Скалярные слоты (текст подставляется внутрь):
         persona-name, persona-avatar, persona-status, persona-model,
         persona-mood, persona-pastime,
         ctx-pastime, ctx-mood, ctx-trend, ctx-initiative, ctx-last-reply,
         ctx-next-reminder, ctx-learning, ctx-last-init (v3: последняя
         самоинициатива; пусто — не было)   (правый сайдбар)

       Кнопки/плашки:
         typing-indicator   виден при атрибуте data-active
         open-dossier       клик = открыть досье
         attach-image       клик = прикрепить картинку к сообщению
                            (файл читает bridge, превью — [data-vpc="attach-preview"],
                            сброс — [data-vpc="cancel-attach"])
         reply-bar          плашка «ответ на…» над вводом: приложение само
                            показывает/прячет (hidden) и заполняет поля
                            reply-author / reply-text; кнопка
                            [data-vpc-action="cancel-reply"] отменяет ответ
       В строке ввода — ТОЛЬКО attach-image, поле ввода и кнопка отправки.
       Кнопку «очистить диалог» (clear-chat) сюда НЕ добавляй: она живёт
       в файле досье, в опасной зоне.

       Списки (контейнер + <template>-образец одного элемента):
         [data-vpc="persona-list"] + <template data-vpc="persona-item">
           левый сайдбар: персоны. Поля: name, status, avatar (v3, <img>
           получает src; нет аватара — поле убирается), unread (v3: число
           непрочитанных; нет — убирается). Корню клона выставляется
           data-active у выбранной персоны и data-unread="N" (v3), если
           есть непрочитанные; клик по элементу переключает персону
           (обрабатывает bridge, вешать ничего не надо).
         [data-vpc="todo-list"] + todo-item  поля: text; кнопка
           [data-vpc-item-action="toggle-todo"] в элементе переключает «сделано»
         [data-vpc="inventory-list"] + inventory-item  поля: icon, name, description, tag
         [data-vpc="feature-list"] + feature-item   поля: label

       Поля сообщения: text, time, image (у <img> ставится src; v3: у
       ответа персоны может быть несколько картинок — скриншоты, тогда
       поле image повторяется следом за собой на каждый кадр), delivery
       (v3: ◷ в очереди / ✓ отправлено / ✓✓ прочитано), quote-author,
       quote-text. Корень клона получает data-status="queued|sent|read"
       (v3; у реплик персоны — только read). Поле с пустым значением удаляется
       из клона автоматически. Клик по картинке (image / attach-preview)
       открывает её крупно — лайтбокс на стороне хоста, в скине ничего
       делать не надо. Действие элемента: кнопка
       [data-vpc-item-action="reply"] в message — ответить на сообщение.

       Контейнеры с data-vpc-optional: если после заполнения внутри не
       осталось ни одного [data-vpc-field], приложение УДАЛЯЕТ такой
       контейнер из клона. Используй для блоков, которые бессмысленны
       пустыми (обёртка цитаты в сообщении и т.п.).

       Длинные списки можно сворачивать: контейнеру списка добавь
       [data-vpc-limit="N"] — bridge отрисует все элементы, но пометит
       старшие (сверх лимита) атрибутом data-extra и поставит контейнеру
       data-collapsed. Прячь их своим CSS:
         [data-collapsed]:not([data-expanded]) > [data-extra] { display:none }
       Кнопка [data-vpc-expand="имя-списка"] переключает data-expanded
       на контейнере (и на себе); она видна (hidden снимается), только
       когда список реально свёрнут.

       Счётчики: элемент [data-vpc-count="<ключ>"] получает число записей
       списка. Ключи этого экрана: personas, todos, inventory, features.

       Окружение (v2): слоты local-time («HH:MM»), weather (строка погоды,
       если задано местоположение), weather-temp («+7°C»).

       Загрузка истории (v3): пока история диалога грузится, контейнер
       ленты получает атрибут data-vpc-loading.

     ДОРИСОВКА (v3). Если какой-то необязательной точки в файле нет,
     bridge дорисует её минимальным блоком с классом .vpc-fallback
     (наследует шрифт и цвет): «печатает…», плашку «ответ на…», превью
     вложения, картинки ответа, значки доставки, счётчик непрочитанных,
     строку «загрузка истории». Боковые панели (список персон, контекст),
     скрытые твоим CSS на узкой ширине (display: none в @media), bridge
     покажет кнопкой у края экрана — панель выдвигается поверх. Лучше
     не прятать панели совсем, а сворачивать их своим способом; тогда
     отключи дорисовку: data-vpc-no-fallback="panels" на корне экрана
     (ключи: typing reply-bar attach images delivery unread loading
     panels, или all).

     ТЕМА, ЯЗЫК, ВРЕМЯ СУТОК (v2). Приложение ставит на <html>:
       data-theme="light|dark"  — тема приложения. Скин ОБЯЗАН выглядеть
                                  прилично в обеих: переопредели палитру
                                  в html[data-theme="light"] { ... }
       lang="ru|en"             — язык интерфейса
       data-vpc-time-of-day="morning|day|evening|night"
       data-vpc-weather="clear|cloudy|fog|rain|snow|storm" (если известна)

     ПОДПИСИ (v2): элемент [data-vpc-label="ключ"] получает локализованный
       текст приложения (содержимое заменяется ЦЕЛИКОМ — ставь на отдельный
       <span>); исходный текст — фолбэк, если подписи нет. Атрибуты:
       data-vpc-label-placeholder / -title / -aria="ключ". Ключи экрана:
       persona-list, open-dossier, open-dossier-title, typing,
       message-placeholder, send, attach, remove-attach, reply,
       cancel-reply, presence, mood, initiative, next-reminder, todos,
       inventory, modules; v3: history-loading, msg-queued, msg-sent,
       msg-read, unread, show-panel, hide-panel. Можно переименовать текст под стиль скина,
       убрав data-vpc-label, — тогда он не локализуется.

     SHELL-ТЕМА КАРКАСА (OPTIONAL): пока открыт экран персоны со скином,
     приложение перекрашивает и свой каркас — левый бар с разделами и
     верхний топбар. Для этого в :root скина объявляются переменные
     --vpc-shell-bg, --vpc-shell-panel, --vpc-shell-text, --vpc-shell-dim,
     --vpc-shell-border, --vpc-shell-accent, --vpc-shell-topbar,
     --vpc-shell-font, --vpc-shell-font-disp, --vpc-shell-font-mono,
     --vpc-shell-radius, --vpc-shell-shadow (все необязательные,
     значения могут ссылаться на свои переменные через var()).
     Держи эти переменные ОДИНАКОВЫМИ во всех трёх файлах скина —
     иначе каркас будет менять палитру при переходе между экранами.

     Сворачивание списков сайдбаров эталон делает нативным <details> —
     можно реализовать иначе, это внутренняя механика скина.

     СВОЙ JS: можно, в блоке «СВОБОДНАЯ ЗОНА» внизу. Отправлять сообщения
     и клики самому не нужно — их обрабатывает bridge-скрипт. Для
     декоративных реакций:
       document 'vpc:state'  (e.detail — весь снапшот данных);
       window.vpc (v2) — bridge стоит в конце <body>, поэтому бери его
       в обработчике DOMContentLoaded или события document 'vpc:ready':
         vpc.contract / vpc.skinContract  версии контракта (прил. / скина)
         vpc.state                        последний снапшот
         vpc.on(event, fn(detail, state)) → функция отписки; события:
           'state'   каждый снапшот
           'message' новое сообщение ленты (история не считается)
           'typing'  смена «печатает» (boolean)
           'mood'    смена настроения
           'theme'   смена темы ('light' | 'dark')
           'persona' смена персоны
         vpc.send(text, image?)           отправить сообщение
         vpc.action(name, values, id?)    действие записи
         vpc.setSetting(key, value)       изменить настройку
         vpc.selectPersona(id), vpc.openDossier(), vpc.closeDossier()
         vpc.zoom(src)                    показать картинку крупно
     Лента сообщений не перерисовывается целиком: узлы сообщений
     переиспользуются по id, CSS-анимация появления проигрывается только
     у новых. Горячие клавиши (Escape, сочетания с Ctrl/Cmd/Alt) уходят
     приложению; оставить клавишу себе — e.preventDefault().
     ═══════════════════════════════════════════════════════════════════════ -->
<html lang="ru" data-vpc-active="chat">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Метаданные скина: контракт (обязательно для v2), имя, автор, версия -->
<meta name="vpc-skin-contract" content="3" />
<meta name="vpc-skin-name" content="VPC Default" />
<meta name="vpc-skin-author" content="Virtual Persona Core" />
<meta name="vpc-skin-version" content="1.0" />
<title>VPC Skin — Chat</title>
<style>

  /* ══════════════ СВОБОДНАЯ ЗОНА: все стили скина ══════════════ */

  :root {
    --bg: #101014;
    --panel: #17171d;
    --line: #2a2a33;
    --text: #e8e6e1;
    --dim: #8b8894;
    --accent: #7ee787;
    --user-bubble: #22304a;
    --persona-bubble: #1d1d24;
    --user-border: #33507e;
    --on-accent: #0b0b0e;

    /* OPTIONAL: SHELL-ТЕМА — палитра каркаса приложения (левый бар с
       разделами, верхний топбар) на время, пока открыт экран этой персоны.
       Ушёл на другой раздел — каркас снова дефолтный. Значения могут
       ссылаться на свои переменные через var() — приложение разрешит их.
       Удалишь блок — каркас останется в дефолтной теме. */
    --vpc-shell-bg: var(--bg);
    --vpc-shell-panel: var(--panel);
    --vpc-shell-text: var(--text);
    --vpc-shell-dim: var(--dim);
    --vpc-shell-border: var(--line);
    --vpc-shell-accent: var(--accent);
    --vpc-shell-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --vpc-shell-radius: 6px;
  }

  /* Светлая тема приложения (v2): приложение ставит html[data-theme].
     Shell-тема каркаса берётся из базового :root выше. */
  html[data-theme="light"] {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --line: #dcd9d0;
    --text: #1d1d22;
    --dim: #6b6874;
    --accent: #1f7a35;
    --user-bubble: #dfe8f7;
    --persona-bubble: #f0efea;
    --user-border: #a9bfe3;
    --on-accent: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ОБЯЗАТЕЛЬНОЕ правило: приложение выставляет на <html> атрибут
     data-vpc-active с именем этого экрана. Экран должен быть виден.
     Оформить можно как угодно иначе. */
  [data-vpc-screen] { display: none; }
  html[data-vpc-active="chat"] [data-vpc-screen="chat"] { display: flex; }

/* ─────────── Экран чата: левый сайдбар + переписка + правый сайдбар ─────────── */

  .chat {
    height: 100vh;
    width: 100%;
  }

  /* Левый сайдбар: список персон */
  .chat-left {
    width: 200px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 8px;
  }

  .pl-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    color: var(--text);
    font: inherit;
    padding: 8px 10px;
    cursor: pointer;
  }
  .pl-item:hover { border-color: var(--line); }
  .pl-item[data-active] { border-color: var(--accent); }
  .pl-item { position: relative; }
  .pl-avatar { float: left; width: 30px; height: 30px; margin-right: 8px; border-radius: 50%; object-fit: cover; }
  .pl-name { display: block; font-weight: 700; }
  .pl-status { display: block; color: var(--dim); font-size: 12px; }
  .pl-unread {
    position: absolute; top: 8px; right: 8px;
    min-width: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: var(--on-accent);
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  }

  /* Центральная колонка */
  .chat-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .chat-avatar {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 18px;
  }

  .chat-name { font-weight: 700; }
  .chat-sub { color: var(--dim); font-size: 12px; }

  .chat-dossier-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    font: inherit;
    padding: 6px 12px;
    cursor: pointer;
  }
  .chat-dossier-btn:hover { color: var(--accent); border-color: var(--accent); }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 72%;
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--persona-bubble);
    align-self: flex-start;
  }

  .msg[data-role="user"] {
    align-self: flex-end;
    background: var(--user-bubble);
    border-color: var(--user-border);
  }

  .msg-quote {
    margin-bottom: 6px;
    padding-left: 8px;
    border-left: 2px solid var(--accent);
    color: var(--dim);
    font-size: 12px;
  }

  .msg-text { white-space: pre-wrap; word-break: break-word; }
  .msg-image { max-width: 240px; display: block; margin-top: 6px; cursor: zoom-in; }
  .msg-time { margin-top: 4px; color: var(--dim); font-size: 11px; text-align: right; }
  .msg-delivery { margin-left: 4px; }
  .msg[data-status="read"] .msg-delivery { color: var(--accent); }

  .msg { position: relative; }
  .msg-reply-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .msg:hover .msg-reply-btn { opacity: 1; }

  /* Плашки ответа и вложения над полем ввода */
  .chat-reply-bar, .chat-attach-bar {
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    font-size: 12px;
  }
  .chat-reply-bar { display: flex; }
  .chat-reply-bar[hidden] { display: none; }
  /* Плашка вложения видна, только когда превью показано */
  .chat-attach-bar { display: none; }
  .chat-attach-bar:has([data-vpc="attach-preview"]:not([hidden])) { display: flex; }
  .chat-reply-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .chat-attach-thumb { max-height: 44px; border: 1px solid var(--line); }

  .chat-typing {
    display: none;
    padding: 4px 16px;
    color: var(--dim);
    font-size: 12px;
  }
  .chat-typing[data-active] { display: block; }

  .chat-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  .chat-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    padding: 8px 10px;
    outline: none;
  }
  .chat-input:focus { border-color: var(--accent); }

  .chat-send {
    background: var(--accent);
    border: 0;
    color: var(--on-accent);
    font: inherit;
    font-weight: 700;
    padding: 8px 18px;
    cursor: pointer;
  }

  .chat-clear {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    font: inherit;
    cursor: pointer;
    padding: 8px 10px;
  }

  /* Правый сайдбар: контекстная панель */
  .chat-right {
    width: 240px;
    flex-shrink: 0;
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px;
  }

  .ctx-title {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    margin: 12px 0 4px;
  }
  .ctx-title:first-child { margin-top: 0; }
  .ctx-line { font-size: 13px; }
  .ctx-note { color: var(--dim); font-size: 12px; }
  .ctx-trend { color: var(--dim); font-size: 12px; }

  .todo-item[data-done] { opacity: 0.45; text-decoration: line-through; }
  .todo-item[data-done] .grow { text-decoration: line-through; }
  .feature-badge {
    display: inline-block;
    border: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
    padding: 1px 6px;
    margin: 0 4px 4px 0;
  }

  /* Раскрывающиеся списки сайдбара (нативный <details>) */
  .ctx-details { margin: 12px 0 0; }
  .ctx-details summary {
    cursor: pointer;
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    user-select: none;
  }
  .ctx-details summary .cnt { color: var(--accent); }
  .ctx-details[open] summary { margin-bottom: 4px; }
</style>
</head>
<body>

<!-- ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ ЭКРАН ЧАТА ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ -->
<section class="chat" data-vpc-screen="chat">

  <!-- OPTIONAL: левый сайдбар — список персон. Клик по элементу
       переключает персону (обрабатывает bridge). -->
  <aside class="chat-left">
    <div class="ctx-title" data-vpc-label="persona-list">Персоны</div>
    <div data-vpc="persona-list"></div>
    <template data-vpc="persona-item">
      <button type="button" class="pl-item">
        <!-- OPTIONAL (v3): аватар персоны и число непрочитанных -->
        <img class="pl-avatar" data-vpc-field="avatar" alt="" />
        <span class="pl-name" data-vpc-field="name"></span>
        <span class="pl-status" data-vpc-field="status"></span>
        <span class="pl-unread" data-vpc-field="unread" data-vpc-label-title="unread"></span>
      </button>
    </template>
  </aside>

  <div class="chat-center">
    <header class="chat-head">
      <!-- OPTIONAL: аватар персоны. Если это не <img>, приложение
           подставит первую букву имени текстом. -->
      <div class="chat-avatar" data-vpc="persona-avatar">?</div>
      <div>
        <!-- OPTIONAL: имя, статус, модель персоны -->
        <div class="chat-name" data-vpc="persona-name">…</div>
        <div class="chat-sub">
          <span data-vpc="persona-status">…</span> · <span data-vpc="persona-model">…</span>
        </div>
      </div>
      <!-- OPTIONAL: клик = открыть досье -->
      <button type="button" class="chat-dossier-btn" data-vpc="open-dossier"
              data-vpc-label="open-dossier" data-vpc-label-title="open-dossier-title">DOSSIER</button>
    </header>

    <!-- REQUIRED: контейнер ленты сообщений. Атрибут data-vpc не трогать.
         Сюда приложение добавляет клоны шаблона сообщения ниже. -->
    <main class="chat-log" data-vpc="messages"></main>

    <!-- REQUIRED: шаблон ОДНОГО сообщения. Не виден на экране — это образец,
         который приложение клонирует на каждое сообщение. Корню клона
         выставляется data-role="user" или "persona". Поля с пустым
         значением (нет цитаты, нет картинки) удаляются из клона сами. -->
    <template data-vpc="message">
      <div class="msg">
        <!-- OPTIONAL: клик = ответить на это сообщение (bridge знает id) -->
        <button type="button" class="item-btn msg-reply-btn" data-vpc-item-action="reply"
                data-vpc-label-title="reply">↩</button>
        <!-- data-vpc-optional: если цитаты нет, приложение удалит этот блок целиком -->
        <div class="msg-quote" data-vpc-optional>
          <b data-vpc-field="quote-author"></b>
          <span data-vpc-field="quote-text"></span>
        </div>
        <div class="msg-text" data-vpc-field="text"></div>
        <img class="msg-image" data-vpc-field="image" alt="" />
        <!-- OPTIONAL (v3): delivery — значок доставки (◷ / ✓ / ✓✓) -->
        <div class="msg-time" data-vpc-optional>
          <span data-vpc-field="time"></span><span class="msg-delivery" data-vpc-field="delivery"></span>
        </div>
      </div>
    </template>

    <!-- OPTIONAL: индикатор «печатает…»; виден при атрибуте data-active -->
    <div class="chat-typing" data-vpc="typing-indicator"><span data-vpc-label="typing">печатает</span>…</div>

    <!-- OPTIONAL: плашка «ответ на сообщение»; приложение само ставит/снимает
         hidden и заполняет поля reply-author / reply-text -->
    <div class="chat-reply-bar" data-vpc="reply-bar" hidden>
      <b data-vpc-field="reply-author"></b>
      <span class="chat-reply-text" data-vpc-field="reply-text"></span>
      <button type="button" class="item-btn" data-vpc-action="cancel-reply" data-vpc-label-title="cancel-reply">✕</button>
    </div>

    <!-- OPTIONAL: превью прикреплённой картинки (файл выбирает bridge) -->
    <div class="chat-attach-bar">
      <img class="chat-attach-thumb" data-vpc="attach-preview" alt="" hidden />
      <button type="button" class="item-btn" data-vpc="cancel-attach" data-vpc-label-title="remove-attach">✕</button>
    </div>

    <div class="chat-bar">
      <!-- В строке ввода — ТОЛЬКО эти три элемента. Кнопку «очистить диалог»
           сюда НЕ добавляй: она живёт в досье, в карточке «Опасная зона». -->
      <!-- OPTIONAL: клик = прикрепить картинку -->
      <button type="button" class="chat-clear" data-vpc="attach-image" title="Прикрепить картинку" data-vpc-label-title="attach">+</button>
      <!-- REQUIRED: поле ввода. Enter = отправка. -->
      <input class="chat-input" data-vpc="input" type="text" placeholder="Сообщение…"
             data-vpc-label-placeholder="message-placeholder" />
      <!-- REQUIRED: кнопка отправки. Клик обрабатывает bridge. -->
      <button type="button" class="chat-send" data-vpc="send" data-vpc-label="send">SEND</button>
    </div>
  </div>

  <!-- OPTIONAL: правый сайдбар — контекстная панель -->
  <aside class="chat-right">
    <!-- data-vpc-label: подпись на языке приложения (исходный текст — фолбэк) -->
    <div class="ctx-title" data-vpc-label="presence">Присутствие</div>
    <div class="ctx-line"><span data-vpc="persona-status">…</span></div>
    <div class="ctx-note" data-vpc="ctx-pastime">…</div>
    <!-- OPTIONAL (v2): локальное время пользователя и погода (пусто — неизвестна) -->
    <div class="ctx-note"><span data-vpc="local-time"></span> <span data-vpc="weather"></span></div>

    <div class="ctx-title" data-vpc-label="mood">Настроение</div>
    <div class="ctx-line">
      <span data-vpc="ctx-mood">…</span> <span class="ctx-trend" data-vpc="ctx-trend"></span>
    </div>

    <div class="ctx-title" data-vpc-label="initiative">Самоинициатива</div>
    <div class="ctx-note" data-vpc="ctx-initiative">…</div>
    <div class="ctx-note" data-vpc="ctx-last-reply">…</div>
    <!-- OPTIONAL (v3): последняя самоинициатива (пусто — не было) -->
    <div class="ctx-note" data-vpc="ctx-last-init"></div>

    <div class="ctx-title" data-vpc-label="next-reminder">Ближайшее напоминание</div>
    <div class="ctx-note" data-vpc="ctx-next-reminder">…</div>

    <!-- OPTIONAL: строка об активном курсе обучения (пустая — курса нет) -->
    <div class="ctx-note" data-vpc="ctx-learning"></div>

    <!-- OPTIONAL: раскрывающиеся списки (нативный <details>).
         [data-vpc-count] в заголовке получает число записей от приложения. -->
    <details class="ctx-details" open>
      <summary><span data-vpc-label="todos">Дела</span> · <span class="cnt" data-vpc-count="todos">0</span></summary>
      <div data-vpc="todo-list"></div>
      <template data-vpc="todo-item">
        <div class="ctx-line todo-item item-row">
          <button type="button" class="item-btn" data-vpc-item-action="toggle-todo">✓</button>
          <span class="grow" data-vpc-field="text"></span>
        </div>
      </template>
    </details>

    <details class="ctx-details">
      <summary><span data-vpc-label="inventory">Инвентарь</span> · <span class="cnt" data-vpc-count="inventory">0</span></summary>
      <div data-vpc="inventory-list"></div>
      <template data-vpc="inventory-item">
        <div class="ctx-line item-row">
          <span data-vpc-field="icon"></span>
          <span class="grow" data-vpc-field="name"></span>
        </div>
      </template>
    </details>

    <details class="ctx-details">
      <summary><span data-vpc-label="modules">Модули</span> · <span class="cnt" data-vpc-count="features">0</span></summary>
      <div data-vpc="feature-list"></div>
      <template data-vpc="feature-item">
        <span class="feature-badge" data-vpc-field="label"></span>
      </template>
    </details>
  </aside>

</section>

<!-- ══════════════ СВОБОДНАЯ ЗОНА: декоративный JS скина ══════════════
     Можно всё стереть или написать своё. Доступно событие 'vpc:state'
     на document (e.detail — снапшот данных экрана) и API window.vpc. -->
<script>
  // Пример: реакция на обновления состояния (можно удалить).
  document.addEventListener('vpc:state', function () { /* декор */ });

  // Пример window.vpc (v2): API появляется к событию 'vpc:ready'
  document.addEventListener('vpc:ready', function () {
    vpc.on('message', function (m) {
      if (m.role === 'persona') { /* новое сообщение персоны: звук, вспышка… */ }
    });
  });
</script>

</body>
</html>
