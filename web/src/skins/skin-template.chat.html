<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════════
     VPC SKIN FILE v1 · ЭКРАН ЧАТА — ПРОЧТИ ЭТОТ БЛОК ПОЛНОСТЬЮ.

     Это самодостаточный файл ОДНОГО экрана скина (визуальной оболочки)
     ИИ-персоны: экран чата с левым сайдбаром (список персон), лентой
     сообщений и правым сайдбаром (контекст персоны). Скин персоны состоит
     из ТРЁХ ОТДЕЛЬНЫХ файлов — чат, досье, комната; этот файл отвечает
     ТОЛЬКО за чат. Не добавляй сюда разметку других экранов.
     Файл рендерится в изолированной песочнице (sandboxed iframe).

     ЖЁСТКИЕ ПРАВИЛА (нарушение = скин не пройдёт проверку при загрузке):

     1. Атрибуты data-vpc="..." и data-vpc-field="..." — НЕ удалять и
        НЕ переименовывать. По ним приложение находит, куда подставлять
        живые данные. Элементы с этими атрибутами МОЖНО перемещать,
        оборачивать в любые контейнеры и стилизовать как угодно —
        лишь бы атрибуты остались.

     2. Блок между маркерами VPC-BRIDGE:START / VPC-BRIDGE:END внизу
        файла — служебный, его ПЕРЕЗАПИШЕТ приложение. Не редактировать.

     3. Никаких внешних ресурсов: запрещены http/https-ссылки, CDN,
        <link>, <script src=...>, картинки и шрифты по URL. Сеть
        заблокирована политикой CSP. Картинки и шрифты — только inline
        (data-URI) или рисуй чистым CSS/SVG.

     4. ВСЁ ОСТАЛЬНОЕ — свободная зона: любая структура страницы,
        любые дополнительные элементы, декор, фоны, анимации, свой JS.
        Скин может выглядеть КАК УГОДНО непохоже на этот шаблон.

     СЛОВАРЬ ТОЧЕК ЭКРАНА ЧАТА.

     Обязательные (REQUIRED — проверяются при загрузке):
         [data-vpc-screen="chat"]   корневой блок экрана
         [data-vpc="messages"]      контейнер ленты сообщений
         <template data-vpc="message">  образец ОДНОГО сообщения; внутри
                                    обязателен [data-vpc-field="text"].
                                    Корень шаблона получает data-role="user"
                                    или data-role="persona" — стилизуй роли
                                    через [data-role="user"] { ... }
         [data-vpc="input"]         поле ввода текста (<input>/<textarea>)
         [data-vpc="send"]          кнопка отправки

     Необязательные (OPTIONAL — если есть, приложение заполнит;
     если удалишь — ничего не сломается):

       Скалярные слоты (текст подставляется внутрь):
         persona-name, persona-avatar, persona-status, persona-model,
         persona-mood, persona-pastime,
         ctx-pastime, ctx-mood, ctx-trend, ctx-initiative, ctx-last-reply,
         ctx-next-reminder, ctx-learning   (правый сайдбар)

       Кнопки/плашки:
         typing-indicator   виден при атрибуте data-active
         open-dossier       клик = открыть досье
         attach-image       клик = прикрепить картинку к сообщению
                            (файл читает bridge, превью — [data-vpc="attach-preview"],
                            сброс — [data-vpc="cancel-attach"])
         reply-bar          плашка «ответ на…» над вводом: приложение само
                            показывает/прячет (hidden) и заполняет поля
                            reply-author / reply-text; кнопка
                            [data-vpc-action="cancel-reply"] отменяет ответ
       В строке ввода — ТОЛЬКО attach-image, поле ввода и кнопка отправки.
       Кнопку «очистить диалог» (clear-chat) сюда НЕ добавляй: она живёт
       в файле досье, в опасной зоне.

       Списки (контейнер + <template>-образец одного элемента):
         [data-vpc="persona-list"] + <template data-vpc="persona-item">
           левый сайдбар: персоны. Поля: name, status. Корню клона
           выставляется data-active у выбранной персоны; клик по элементу
           переключает персону (обрабатывает bridge, вешать ничего не надо).
         [data-vpc="inventory-list"] + inventory-item  поля: icon, name, description, tag
         [data-vpc="feature-list"] + feature-item   поля: label

       Поля сообщения: text, time, image (у <img> ставится src),
       quote-author, quote-text. Поле с пустым значением удаляется
       из клона автоматически. Клик по картинке (image / attach-preview)
       открывает её крупно — лайтбокс на стороне хоста, в скине ничего
       делать не надо. Действие элемента: кнопка
       [data-vpc-item-action="reply"] в message — ответить на сообщение.

       Контейнеры с data-vpc-optional: если после заполнения внутри не
       осталось ни одного [data-vpc-field], приложение УДАЛЯЕТ такой
       контейнер из клона. Используй для блоков, которые бессмысленны
       пустыми (обёртка цитаты в сообщении и т.п.).

       Длинные списки можно сворачивать: контейнеру списка добавь
       [data-vpc-limit="N"] — bridge отрисует все элементы, но пометит
       старшие (сверх лимита) атрибутом data-extra и поставит контейнеру
       data-collapsed. Прячь их своим CSS:
         [data-collapsed]:not([data-expanded]) > [data-extra] { display:none }
       Кнопка [data-vpc-expand="имя-списка"] переключает data-expanded
       на контейнере (и на себе); она видна (hidden снимается), только
       когда список реально свёрнут.

       Счётчики: элемент [data-vpc-count="<ключ>"] получает число записей
       списка. Ключи этого экрана: personas, inventory, features.

     SHELL-ТЕМА КАРКАСА (OPTIONAL): пока открыт экран персоны со скином,
     приложение перекрашивает и свой каркас — левый бар с разделами и
     верхний топбар. Для этого в :root скина объявляются переменные
     --vpc-shell-bg, --vpc-shell-panel, --vpc-shell-text, --vpc-shell-dim,
     --vpc-shell-border, --vpc-shell-accent, --vpc-shell-topbar,
     --vpc-shell-font, --vpc-shell-font-disp, --vpc-shell-font-mono,
     --vpc-shell-radius, --vpc-shell-shadow (все необязательные,
     значения могут ссылаться на свои переменные через var()).
     Держи эти переменные ОДИНАКОВЫМИ во всех трёх файлах скина —
     иначе каркас будет менять палитру при переходе между экранами.

     Сворачивание списков сайдбаров эталон делает нативным <details> —
     можно реализовать иначе, это внутренняя механика скина.

     СВОЙ JS: можно, в блоке «СВОБОДНАЯ ЗОНА» внизу. Доступно событие
     document 'vpc:state' (e.detail — весь снапшот данных) для
     декоративных реакций. Отправлять сообщения и клики самому не нужно —
     их обрабатывает bridge-скрипт.
     ═══════════════════════════════════════════════════════════════════════ -->
<html lang="ru" data-vpc-active="chat">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VPC Skin — Chat</title>
<style>

  /* ══════════════ СВОБОДНАЯ ЗОНА: все стили скина ══════════════ */

  :root {
    --bg: #101014;
    --panel: #17171d;
    --line: #2a2a33;
    --text: #e8e6e1;
    --dim: #8b8894;
    --accent: #7ee787;
    --user-bubble: #22304a;
    --persona-bubble: #1d1d24;

    /* OPTIONAL: SHELL-ТЕМА — палитра каркаса приложения (левый бар с
       разделами, верхний топбар) на время, пока открыт экран этой персоны.
       Ушёл на другой раздел — каркас снова дефолтный. Значения могут
       ссылаться на свои переменные через var() — приложение разрешит их.
       Удалишь блок — каркас останется в дефолтной теме. */
    --vpc-shell-bg: var(--bg);
    --vpc-shell-panel: var(--panel);
    --vpc-shell-text: var(--text);
    --vpc-shell-dim: var(--dim);
    --vpc-shell-border: var(--line);
    --vpc-shell-accent: var(--accent);
    --vpc-shell-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --vpc-shell-radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ОБЯЗАТЕЛЬНОЕ правило: приложение выставляет на <html> атрибут
     data-vpc-active с именем этого экрана. Экран должен быть виден.
     Оформить можно как угодно иначе. */
  [data-vpc-screen] { display: none; }
  html[data-vpc-active="chat"] [data-vpc-screen="chat"] { display: flex; }

/* ─────────── Экран чата: левый сайдбар + переписка + правый сайдбар ─────────── */

  .chat {
    height: 100vh;
    width: 100%;
  }

  /* Левый сайдбар: список персон */
  .chat-left {
    width: 200px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 8px;
  }

  .pl-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    color: var(--text);
    font: inherit;
    padding: 8px 10px;
    cursor: pointer;
  }
  .pl-item:hover { border-color: var(--line); }
  .pl-item[data-active] { border-color: var(--accent); }
  .pl-name { display: block; font-weight: 700; }
  .pl-status { display: block; color: var(--dim); font-size: 12px; }

  /* Центральная колонка */
  .chat-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .chat-avatar {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 18px;
  }

  .chat-name { font-weight: 700; }
  .chat-sub { color: var(--dim); font-size: 12px; }

  .chat-dossier-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    font: inherit;
    padding: 6px 12px;
    cursor: pointer;
  }
  .chat-dossier-btn:hover { color: var(--accent); border-color: var(--accent); }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 72%;
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--persona-bubble);
    align-self: flex-start;
  }

  .msg[data-role="user"] {
    align-self: flex-end;
    background: var(--user-bubble);
    border-color: #33507e;
  }

  .msg-quote {
    margin-bottom: 6px;
    padding-left: 8px;
    border-left: 2px solid var(--accent);
    color: var(--dim);
    font-size: 12px;
  }

  .msg-text { white-space: pre-wrap; word-break: break-word; }
  .msg-image { max-width: 240px; display: block; margin-top: 6px; }
  .msg-time { margin-top: 4px; color: var(--dim); font-size: 11px; text-align: right; }

  .msg { position: relative; }
  .msg-reply-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .msg:hover .msg-reply-btn { opacity: 1; }

  /* Плашки ответа и вложения над полем ввода */
  .chat-reply-bar, .chat-attach-bar {
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    font-size: 12px;
  }
  .chat-reply-bar { display: flex; }
  .chat-reply-bar[hidden] { display: none; }
  /* Плашка вложения видна, только когда превью показано */
  .chat-attach-bar { display: none; }
  .chat-attach-bar:has([data-vpc="attach-preview"]:not([hidden])) { display: flex; }
  .chat-reply-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .chat-attach-thumb { max-height: 44px; border: 1px solid var(--line); }

  .chat-typing {
    display: none;
    padding: 4px 16px;
    color: var(--dim);
    font-size: 12px;
  }
  .chat-typing[data-active] { display: block; }

  .chat-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  .chat-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    padding: 8px 10px;
    outline: none;
  }
  .chat-input:focus { border-color: var(--accent); }

  .chat-send {
    background: var(--accent);
    border: 0;
    color: #0b0b0e;
    font: inherit;
    font-weight: 700;
    padding: 8px 18px;
    cursor: pointer;
  }

  .chat-clear {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    font: inherit;
    cursor: pointer;
    padding: 8px 10px;
  }

  /* Правый сайдбар: контекстная панель */
  .chat-right {
    width: 240px;
    flex-shrink: 0;
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px;
  }

  .ctx-title {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    margin: 12px 0 4px;
  }
  .ctx-title:first-child { margin-top: 0; }
  .ctx-line { font-size: 13px; }
  .ctx-note { color: var(--dim); font-size: 12px; }
  .ctx-trend { color: var(--dim); font-size: 12px; }

  .todo-item[data-done] { opacity: 0.45; text-decoration: line-through; }
  .todo-item[data-done] .grow { text-decoration: line-through; }
  .feature-badge {
    display: inline-block;
    border: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
    padding: 1px 6px;
    margin: 0 4px 4px 0;
  }

  /* Раскрывающиеся списки сайдбара (нативный <details>) */
  .ctx-details { margin: 12px 0 0; }
  .ctx-details summary {
    cursor: pointer;
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    user-select: none;
  }
  .ctx-details summary .cnt { color: var(--accent); }
  .ctx-details[open] summary { margin-bottom: 4px; }

  /* Вкладки досье (переключает JS из свободной зоны) */
  .dossier-tabs {
    display: flex;
    gap: 4px;
    padding: 8px 16px 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .dossier-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--dim);
    font: inherit;
    padding: 8px 12px;
    cursor: pointer;
  }
  .dossier-tab.tab-active { color: var(--accent); border-bottom-color: var(--accent); }
  .dossier-page { display: none; }
  .dossier-page.page-active {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-content: start;
  }
  @media (max-width: 800px) { .dossier-page.page-active { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ ЭКРАН ЧАТА ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ -->
<section class="chat" data-vpc-screen="chat">

  <!-- OPTIONAL: левый сайдбар — список персон. Клик по элементу
       переключает персону (обрабатывает bridge). -->
  <aside class="chat-left">
    <div data-vpc="persona-list"></div>
    <template data-vpc="persona-item">
      <button type="button" class="pl-item">
        <span class="pl-name" data-vpc-field="name"></span>
        <span class="pl-status" data-vpc-field="status"></span>
      </button>
    </template>
  </aside>

  <div class="chat-center">
    <header class="chat-head">
      <!-- OPTIONAL: аватар персоны. Если это не <img>, приложение
           подставит первую букву имени текстом. -->
      <div class="chat-avatar" data-vpc="persona-avatar">?</div>
      <div>
        <!-- OPTIONAL: имя, статус, модель персоны -->
        <div class="chat-name" data-vpc="persona-name">…</div>
        <div class="chat-sub">
          <span data-vpc="persona-status">…</span> · <span data-vpc="persona-model">…</span>
        </div>
      </div>
      <!-- OPTIONAL: клик = открыть досье -->
      <button type="button" class="chat-dossier-btn" data-vpc="open-dossier">DOSSIER</button>
    </header>

    <!-- REQUIRED: контейнер ленты сообщений. Атрибут data-vpc не трогать.
         Сюда приложение добавляет клоны шаблона сообщения ниже. -->
    <main class="chat-log" data-vpc="messages"></main>

    <!-- REQUIRED: шаблон ОДНОГО сообщения. Не виден на экране — это образец,
         который приложение клонирует на каждое сообщение. Корню клона
         выставляется data-role="user" или "persona". Поля с пустым
         значением (нет цитаты, нет картинки) удаляются из клона сами. -->
    <template data-vpc="message">
      <div class="msg">
        <!-- OPTIONAL: клик = ответить на это сообщение (bridge знает id) -->
        <button type="button" class="item-btn msg-reply-btn" data-vpc-item-action="reply">↩</button>
        <!-- data-vpc-optional: если цитаты нет, приложение удалит этот блок целиком -->
        <div class="msg-quote" data-vpc-optional>
          <b data-vpc-field="quote-author"></b>
          <span data-vpc-field="quote-text"></span>
        </div>
        <div class="msg-text" data-vpc-field="text"></div>
        <img class="msg-image" data-vpc-field="image" alt="" />
        <div class="msg-time" data-vpc-field="time"></div>
      </div>
    </template>

    <!-- OPTIONAL: индикатор «печатает…»; виден при атрибуте data-active -->
    <div class="chat-typing" data-vpc="typing-indicator">печатает…</div>

    <!-- OPTIONAL: плашка «ответ на сообщение»; приложение само ставит/снимает
         hidden и заполняет поля reply-author / reply-text -->
    <div class="chat-reply-bar" data-vpc="reply-bar" hidden>
      <b data-vpc-field="reply-author"></b>
      <span class="chat-reply-text" data-vpc-field="reply-text"></span>
      <button type="button" class="item-btn" data-vpc-action="cancel-reply">✕</button>
    </div>

    <!-- OPTIONAL: превью прикреплённой картинки (файл выбирает bridge) -->
    <div class="chat-attach-bar">
      <img class="chat-attach-thumb" data-vpc="attach-preview" alt="" hidden />
      <button type="button" class="item-btn" data-vpc="cancel-attach">✕</button>
    </div>

    <div class="chat-bar">
      <!-- В строке ввода — ТОЛЬКО эти три элемента. Кнопку «очистить диалог»
           сюда НЕ добавляй: она живёт в досье, в карточке «Опасная зона». -->
      <!-- OPTIONAL: клик = прикрепить картинку -->
      <button type="button" class="chat-clear" data-vpc="attach-image" title="Прикрепить картинку">+</button>
      <!-- REQUIRED: поле ввода. Enter = отправка. -->
      <input class="chat-input" data-vpc="input" type="text" placeholder="Сообщение…" />
      <!-- REQUIRED: кнопка отправки. Клик обрабатывает bridge. -->
      <button type="button" class="chat-send" data-vpc="send">SEND</button>
    </div>
  </div>

  <!-- OPTIONAL: правый сайдбар — контекстная панель -->
  <aside class="chat-right">
    <div class="ctx-title">Присутствие</div>
    <div class="ctx-line"><span data-vpc="persona-status">…</span></div>
    <div class="ctx-note" data-vpc="ctx-pastime">…</div>

    <div class="ctx-title">Настроение</div>
    <div class="ctx-line">
      <span data-vpc="ctx-mood">…</span> <span class="ctx-trend" data-vpc="ctx-trend"></span>
    </div>

    <div class="ctx-title">Самоинициатива</div>
    <div class="ctx-note" data-vpc="ctx-initiative">…</div>
    <div class="ctx-note" data-vpc="ctx-last-reply">…</div>

    <div class="ctx-title">Ближайшее напоминание</div>
    <div class="ctx-note" data-vpc="ctx-next-reminder">…</div>

    <!-- OPTIONAL: строка об активном курсе обучения (пустая — курса нет) -->
    <div class="ctx-note" data-vpc="ctx-learning"></div>

    <!-- OPTIONAL: раскрывающиеся списки (нативный <details>).
         [data-vpc-count] в заголовке получает число записей от приложения. -->
    <details class="ctx-details" open>
      <summary>Дела · <span class="cnt" data-vpc-count="todos">0</span></summary>
      <div data-vpc="todo-list"></div>
      <template data-vpc="todo-item">
        <div class="ctx-line todo-item item-row">
          <button type="button" class="item-btn" data-vpc-item-action="toggle-todo">✓</button>
          <span class="grow" data-vpc-field="text"></span>
        </div>
      </template>
    </details>

    <details class="ctx-details">
      <summary>Инвентарь · <span class="cnt" data-vpc-count="inventory">0</span></summary>
      <div data-vpc="inventory-list"></div>
      <template data-vpc="inventory-item">
        <div class="ctx-line item-row">
          <span data-vpc-field="icon"></span>
          <span class="grow" data-vpc-field="name"></span>
        </div>
      </template>
    </details>

    <details class="ctx-details">
      <summary>Модули · <span class="cnt" data-vpc-count="features">0</span></summary>
      <div data-vpc="feature-list"></div>
      <template data-vpc="feature-item">
        <span class="feature-badge" data-vpc-field="label"></span>
      </template>
    </details>
  </aside>

</section>
