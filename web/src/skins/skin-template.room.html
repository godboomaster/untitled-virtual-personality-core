<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════════
     VPC SKIN FILE · КОНТРАКТ v2 · ЭКРАН КОМНАТЫ — ПРОЧТИ ЭТОТ БЛОК ПОЛНОСТЬЮ.

     Это самодостаточный файл ОДНОГО экрана скина (визуальной оболочки)
     ИИ-персоны: её комната (сцена, аватар, состояние, лента событий,
     инвентарь). Скин персоны состоит из ТРЁХ ОТДЕЛЬНЫХ файлов — чат,
     досье, комната; этот файл отвечает ТОЛЬКО за комнату. Не добавляй
     сюда разметку других экранов.
     Файл рендерится в изолированной песочнице (sandboxed iframe).

     ЖЁСТКИЕ ПРАВИЛА (нарушение = скин не пройдёт проверку при загрузке):

     1. Атрибуты data-vpc="..." и data-vpc-field="..." — НЕ удалять и
        НЕ переименовывать. По ним приложение находит, куда подставлять
        живые данные. Элементы с этими атрибутами МОЖНО перемещать,
        оборачивать в любые контейнеры и стилизовать как угодно —
        лишь бы атрибуты остались.

     2. Блок между маркерами VPC-BRIDGE:START / VPC-BRIDGE:END внизу
        файла — служебный, его ПЕРЕЗАПИШЕТ приложение. Не редактировать.

     3. Никаких внешних ресурсов: запрещены http/https-ссылки, CDN,
        <link>, <script src=...>, картинки и шрифты по URL. Сеть
        заблокирована политикой CSP. Картинки и шрифты — только inline
        (data-URI) или рисуй чистым CSS/SVG.

     4. Мета vpc-skin-contract в <head> (сейчас content="2") — версия
        контракта, на который рассчитан файл. Не повышай её сам: скин
        с версией новее приложения не загрузится. Нет меты — контракт v1.
        Имя/автор/версия скина — мета vpc-skin-name / -author / -version.

     5. ВСЁ ОСТАЛЬНОЕ — свободная зона: любая структура страницы,
        любые дополнительные элементы, декор, фоны, анимации, свой JS.
        Скин может выглядеть КАК УГОДНО непохоже на этот шаблон.

     СЛОВАРЬ ТОЧЕК ЭКРАНА КОМНАТЫ.

     Обязательные (REQUIRED — проверяются при загрузке):
         [data-vpc-screen="room"]   корневой блок экрана
         [data-vpc="room-scene"]    корень сцены комнаты
         [data-vpc="room-avatar"]   аватар персоны; приложение двигает его,
                                    выставляя CSS-переменные --vpc-x и --vpc-y
                                    (в процентах размера сцены)
         [data-vpc="room-pastime"]  подпись текущего занятия персоны

     Необязательные (OPTIONAL — если есть, приложение заполнит;
     если удалишь — ничего не сломается):

       Скалярные слоты: persona-name, persona-status,
         room-mood, room-energy, room-place, room-pet-label.

       Элементы:
         room-bg, room-sprite  (<img>, src подставит приложение)
         room-pet           приложение ставит data-pet="cat|crow"

       Списки (контейнер + <template>-образец одного элемента):
         [data-vpc="room-inventory"] + inventory-item  поля: icon, name, description, tag
         [data-vpc="room-feed"] + feed-item         поля: time, text

       Действие записи: форма [data-vpc-form] с инпутами
       [data-vpc-input="name"], [data-vpc-input="icon"] и кнопкой
       [data-vpc-action="add-inventory-item"] — добавить предмет в инвентарь.

       Длинные списки можно сворачивать: контейнеру списка добавь
       [data-vpc-limit="N"] — bridge отрисует все элементы, но пометит
       старшие (сверх лимита) атрибутом data-extra и поставит контейнеру
       data-collapsed. Прячь их своим CSS:
         [data-collapsed]:not([data-expanded]) > [data-extra] { display:none }
       Кнопка [data-vpc-expand="имя-списка"] переключает data-expanded
       на контейнере (и на себе); она видна (hidden снимается), только
       когда список реально свёрнут.

       Счётчики: [data-vpc-count="inventory"], [data-vpc-count="feed"].

       Окружение (v2): слоты local-time («HH:MM»), weather (строка погоды,
       если задано местоположение), weather-temp («+7°C»).

     ТЕМА, ЯЗЫК, ВРЕМЯ СУТОК (v2). Приложение ставит на <html>:
       data-theme="light|dark"  — тема приложения. Скин ОБЯЗАН выглядеть
                                  прилично в обеих: переопредели палитру
                                  в html[data-theme="light"] { ... }
       lang="ru|en"             — язык интерфейса
       data-vpc-time-of-day="morning|day|evening|night" — удобно менять
                                  освещение сцены
       data-vpc-weather="clear|cloudy|fog|rain|snow|storm" (если известна)

     ПОДПИСИ (v2): элемент [data-vpc-label="ключ"] получает локализованный
       текст приложения (содержимое заменяется ЦЕЛИКОМ — ставь на отдельный
       <span>); исходный текст — фолбэк, если подписи нет. Атрибуты:
       data-vpc-label-placeholder / -title / -aria="ключ". Ключи экрана:
       room-mood, room-energy, room-place, room-feed, inventory,
       item-name, item-icon, add-item.

     SHELL-ТЕМА КАРКАСА (OPTIONAL): пока открыт экран персоны со скином,
     приложение перекрашивает и свой каркас — левый бар с разделами и
     верхний топбар. Для этого в :root скина объявляются переменные
     --vpc-shell-bg, --vpc-shell-panel, --vpc-shell-text, --vpc-shell-dim,
     --vpc-shell-border, --vpc-shell-accent, --vpc-shell-topbar,
     --vpc-shell-font, --vpc-shell-font-disp, --vpc-shell-font-mono,
     --vpc-shell-radius, --vpc-shell-shadow (все необязательные,
     значения могут ссылаться на свои переменные через var()).
     Держи эти переменные ОДИНАКОВЫМИ во всех трёх файлах скина —
     иначе каркас будет менять палитру при переходе между экранами.

     СВОЙ JS: можно, в блоке «СВОБОДНАЯ ЗОНА» внизу. Клики по hook-точкам
     обрабатывает bridge-скрипт. Для декоративных реакций:
       document 'vpc:state'  (e.detail — весь снапшот данных);
       window.vpc (v2) — bridge стоит в конце <body>, поэтому бери его
       в обработчике DOMContentLoaded или события document 'vpc:ready':
         vpc.contract / vpc.skinContract  версии контракта (прил. / скина)
         vpc.state                        последний снапшот
         vpc.on(event, fn(detail, state)) → функция отписки; события:
           'state'   каждый снапшот
           'mood'    смена настроения
           'theme'   смена темы ('light' | 'dark')
           'persona' смена персоны
         vpc.action(name, values, id?)    действие записи
                                          (напр. 'add-inventory-item')
         vpc.zoom(src)                    показать картинку крупно
     Списки перерисовываются, только когда изменились их данные.
     Горячие клавиши (Escape, сочетания с Ctrl/Cmd/Alt) уходят
     приложению; оставить клавишу себе — e.preventDefault().
     ═══════════════════════════════════════════════════════════════════════ -->
<html lang="ru" data-vpc-active="room">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Метаданные скина: контракт (обязательно для v2), имя, автор, версия -->
<meta name="vpc-skin-contract" content="2" />
<meta name="vpc-skin-name" content="VPC Default" />
<meta name="vpc-skin-author" content="Virtual Persona Core" />
<meta name="vpc-skin-version" content="1.0" />
<title>VPC Skin — Room</title>
<style>

  /* ══════════════ СВОБОДНАЯ ЗОНА: все стили скина ══════════════ */

  :root {
    --bg: #101014;
    --panel: #17171d;
    --line: #2a2a33;
    --text: #e8e6e1;
    --dim: #8b8894;
    --accent: #7ee787;
    --user-bubble: #22304a;
    --persona-bubble: #1d1d24;
    --scene-top: #14141a;
    --scene-bottom: #101014;
    --floor: #191920;
    --plate: rgba(10, 10, 14, 0.8);
    --avatar-bg: rgba(0, 0, 0, 0.35);

    /* OPTIONAL: SHELL-ТЕМА — палитра каркаса приложения (левый бар с
       разделами, верхний топбар) на время, пока открыт экран этой персоны.
       Ушёл на другой раздел — каркас снова дефолтный. Значения могут
       ссылаться на свои переменные через var() — приложение разрешит их.
       Удалишь блок — каркас останется в дефолтной теме. */
    --vpc-shell-bg: var(--bg);
    --vpc-shell-panel: var(--panel);
    --vpc-shell-text: var(--text);
    --vpc-shell-dim: var(--dim);
    --vpc-shell-border: var(--line);
    --vpc-shell-accent: var(--accent);
    --vpc-shell-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --vpc-shell-radius: 6px;
  }

  /* Светлая тема приложения (v2): приложение ставит html[data-theme].
     Shell-тема каркаса берётся из базового :root выше. */
  html[data-theme="light"] {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --line: #dcd9d0;
    --text: #1d1d22;
    --dim: #6b6874;
    --accent: #1f7a35;
    --scene-top: #e9eef4;
    --scene-bottom: #f4f3ef;
    --floor: #e2ddd2;
    --plate: rgba(255, 255, 255, 0.85);
    --avatar-bg: rgba(255, 255, 255, 0.6);
  }

  /* Время суток (v2): тонировка сцены — тёплая вечером, синяя ночью */
  .room-scene::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: background 2s;
  }
  html[data-vpc-time-of-day="evening"] .room-scene::after { background: rgba(255, 140, 60, 0.07); }
  html[data-vpc-time-of-day="night"] .room-scene::after { background: rgba(10, 20, 60, 0.2); }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ОБЯЗАТЕЛЬНОЕ правило: приложение выставляет на <html> атрибут
     data-vpc-active с именем этого экрана. Экран должен быть виден.
     Оформить можно как угодно иначе. */
  [data-vpc-screen] { display: none; }
  html[data-vpc-active="room"] [data-vpc-screen="room"] { display: flex; }

/* ─────────── Экран комнаты ─────────── */

  .room {
    height: 100vh;
    width: 100%;
    flex-direction: column;
  }

  .room-scene {
    position: relative;
    flex: 1;
    min-height: 320px;
    overflow: hidden;
    background:
      linear-gradient(180deg, var(--scene-top) 0%, var(--scene-bottom) 70%),
      var(--bg);
    border-bottom: 1px solid var(--line);
  }

  .room-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .room-floor {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 18%;
    background: var(--floor);
    border-top: 1px solid var(--line);
  }

  /* Аватар двигает приложение через --vpc-x / --vpc-y */
  .room-avatar {
    position: absolute;
    left: var(--vpc-x, 50%);
    top: var(--vpc-y, 78%);
    transform: translate(-50%, -100%);
    transition: left 1.2s ease, top 1.2s ease;
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 24px;
    background: var(--avatar-bg);
  }

  .room-pastime-plate {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 6px 10px;
    background: var(--plate);
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--dim);
  }
  .room-pastime-plate .val { color: var(--accent); }

  .room-pet {
    position: absolute;
    right: 12%;
    bottom: 12%;
    color: var(--dim);
    font-size: 12px;
  }
  .room-pet::before { content: '🐈'; display: block; font-size: 26px; }
  .room-pet[data-pet="crow"]::before { content: '🐦‍⬛'; }

  .room-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--line);
    border-bottom: 1px solid var(--line);
  }
  .room-stat { background: var(--panel); padding: 10px 14px; }
  .room-stat-label { color: var(--dim); font-size: 11px; text-transform: uppercase; }
  .room-stat-value { margin-top: 2px; }

  .room-lists {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
    overflow-y: auto;
  }
  @media (max-width: 700px) { .room-lists { grid-template-columns: 1fr; } }

  .room-card {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 14px;
  }
  .room-card-title { color: var(--dim); font-size: 12px; margin-bottom: 8px; }

  .feed-item { display: flex; gap: 10px; padding: 4px 0; }
  .feed-time { color: var(--dim); flex-shrink: 0; }

  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .inv-item { border: 1px solid var(--line); padding: 8px; }
  .inv-icon { font-size: 20px; }
  .inv-name { margin-top: 4px; }
  .inv-desc { color: var(--dim); font-size: 11px; }
  .inv-tag { color: var(--accent); font-size: 11px; }
</style>
</head>
<body>

<!-- ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ ЭКРАН КОМНАТЫ ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ -->
<section class="room" data-vpc-screen="room">

  <!-- REQUIRED: корень сцены комнаты -->
  <div class="room-scene" data-vpc="room-scene">
    <!-- OPTIONAL: пользовательский фон комнаты (<img>, src подставит приложение) -->
    <img class="room-bg-img" data-vpc="room-bg" alt="" hidden />
    <div class="room-floor"></div>

    <!-- REQUIRED: аватар персоны. Приложение двигает его через
         CSS-переменные --vpc-x / --vpc-y (% сцены). -->
    <div class="room-avatar" data-vpc="room-avatar">
      <span data-vpc="persona-avatar">?</span>
    </div>

    <!-- REQUIRED: подпись текущего занятия -->
    <div class="room-pastime-plate">
      <span data-vpc="persona-name">…</span> · <span class="val" data-vpc="room-pastime">…</span>
    </div>

    <!-- OPTIONAL: питомец; приложение ставит data-pet="cat|crow" -->
    <div class="room-pet" data-vpc="room-pet" hidden><span data-vpc="room-pet-label"></span></div>
  </div>

  <!-- OPTIONAL: виджеты состояния -->
  <div class="room-stats">
    <div class="room-stat">
      <div class="room-stat-label" data-vpc-label="room-mood">Настроение</div>
      <div class="room-stat-value" data-vpc="room-mood">…</div>
    </div>
    <div class="room-stat">
      <div class="room-stat-label" data-vpc-label="room-energy">Энергия</div>
      <div class="room-stat-value" data-vpc="room-energy">…</div>
    </div>
    <div class="room-stat">
      <div class="room-stat-label" data-vpc-label="room-place">Место</div>
      <div class="room-stat-value" data-vpc="room-place">…</div>
    </div>
    <!-- OPTIONAL (v2): локальное время пользователя и погода (пусто — неизвестна) -->
    <div class="room-stat">
      <div class="room-stat-label"><span data-vpc="local-time"></span></div>
      <div class="room-stat-value"><span data-vpc="weather-temp"></span></div>
    </div>
  </div>

  <div class="room-lists">
    <div class="room-card">
      <div class="room-card-title" data-vpc-label="room-feed">Пока тебя не было</div>
      <!-- OPTIONAL: лента активности; строки — клоны шаблона feed-item -->
      <div data-vpc="room-feed"></div>
      <template data-vpc="feed-item">
        <div class="feed-item">
          <span class="feed-time" data-vpc-field="time"></span>
          <span data-vpc-field="text"></span>
        </div>
      </template>
    </div>

    <div class="room-card">
      <div class="room-card-title" data-vpc-label="inventory">Инвентарь</div>
      <!-- OPTIONAL: инвентарь; предметы — клоны шаблона inventory-item -->
      <div class="inv-grid" data-vpc="room-inventory"></div>
      <template data-vpc="inventory-item">
        <div class="inv-item">
          <div class="inv-icon" data-vpc-field="icon"></div>
          <div class="inv-name" data-vpc-field="name"></div>
          <div class="inv-desc" data-vpc-field="description"></div>
          <div class="inv-tag" data-vpc-field="tag"></div>
        </div>
      </template>
      <!-- OPTIONAL: форма добавления предмета в инвентарь -->
      <div class="vpc-form" data-vpc-form>
        <input data-vpc-input="name" type="text" placeholder="название предмета" data-vpc-label-placeholder="item-name" />
        <input data-vpc-input="icon" type="text" placeholder="глиф" data-vpc-label-placeholder="item-icon" style="max-width: 64px" />
        <button type="button" data-vpc-action="add-inventory-item" data-vpc-label-title="add-item">+</button>
      </div>
    </div>
  </div>

</section>

<!-- ══════════════ СВОБОДНАЯ ЗОНА: декоративный JS скина ══════════════
     Можно всё стереть или написать своё. Доступно событие 'vpc:state'
     на document (e.detail — снапшот данных экрана) и API window.vpc. -->
<script>
  // Пример: реакция на обновления состояния (можно удалить).
  document.addEventListener('vpc:state', function () { /* декор */ });
</script>

<!-- ==== VPC-BRIDGE:START ====
     Служебный блок: при загрузке скина приложение ПЕРЕЗАПИШЕТ его
     своей эталонной версией. Не редактировать, не удалять маркеры. -->
<script>/* заглушка: приложение подставит сюда рабочий код моста */</script>
<!-- ==== VPC-BRIDGE:END ==== -->

</body>
</html>
